<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>DecoSoft Hub</title>
<meta name="theme-color" content="#0A0C12">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DecoSoft Hub" id="metaAppleTitle">
<link rel="icon" id="favicon" href="data:,">
<link rel="apple-touch-icon" id="touchIcon" href="data:,">
<link rel="manifest" id="manifestLink" href="data:application/manifest+json,%7B%7D">
<style>
  :root{
    --bg:#0A0C12; --surface:#12151F; --surface-2:#181C29; --surface-3:#232838;
    --line:rgba(255,255,255,0.08); --line-2:rgba(255,255,255,0.16);
    --text:#EEF0F6; --muted:#9BA3B8; --faint:#5B6178;
    --brand:#7C5CFF; --brand-2:#22D3EE; --ok:#34D399; --warn:#FBBF24; --bad:#F87171;
    --bar-h:42px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);}
  body{overflow:hidden;}
  button,input{font-family:inherit;color:inherit;}
  button{cursor:pointer;}
  .screen{position:fixed;inset:0;display:none;}
  .screen.on{display:block;}
  .scroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;}

  /* ---------- splash ---------- */
  #splash.on{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
  .spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--surface-3);border-top-color:var(--brand-2);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- brand ---------- */
  .logo{display:flex;align-items:center;gap:10px;}
  .logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:flex;align-items:center;justify-content:center;color:#0A0C12;flex:0 0 auto;}
  .logo-mark svg{width:20px;height:20px;}
  .logo-name{font-weight:800;font-size:16px;letter-spacing:-0.01em;}
  .logo-sub{font-size:11px;color:var(--muted);}

  /* ---------- login ---------- */
  #login .scroll{display:flex;align-items:center;justify-content:center;padding:24px 18px calc(24px + env(safe-area-inset-bottom));}
  .login-card{width:100%;max-width:380px;}
  .login-card .logo{justify-content:center;margin-bottom:28px;}
  .login-card .logo-mark{width:44px;height:44px;border-radius:13px;}
  .login-card .logo-mark svg{width:26px;height:26px;}
  .login-card .logo-name{font-size:20px;}
  .lbox{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;}
  .lbox h1{font-size:20px;margin:0 0 4px;letter-spacing:-0.01em;}
  .lbox .sub{color:var(--muted);font-size:13px;margin-bottom:18px;}
  .fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .fld label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .fld input{background:var(--bg);border:1px solid var(--line-2);border-radius:12px;padding:12px 13px;font-size:16px;}
  .fld input:focus{outline:none;border-color:var(--brand-2);}
  .pw{position:relative;}
  .pw input{width:100%;padding-right:64px;}
  .pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:700;padding:8px;}
  .btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:14px;}
  .btn-main{width:100%;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#0A0C12;margin-top:6px;}
  .btn-main:disabled{opacity:.6;cursor:default;}
  .btn-ghost{background:var(--surface-2);border:1px solid var(--line);color:var(--text);}
  .btn-danger{background:transparent;border:1px solid rgba(248,113,113,.45);color:var(--bad);}
  .switch-mode{text-align:center;margin-top:14px;font-size:13px;color:var(--muted);}
  .switch-mode button{background:none;border:0;color:var(--brand-2);font-weight:800;font-size:13px;padding:4px;}
  .err{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.35);color:#fca5a5;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:none;line-height:1.45;}
  .err.on{display:block;}
  .mode-note{margin-top:16px;font-size:12px;color:var(--muted);text-align:center;line-height:1.5;}
  .mode-note b{color:var(--warn);}

  /* ---------- home ---------- */
  .home-wrap{max-width:860px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));}
  .home-top{display:flex;align-items:center;gap:10px;margin-bottom:26px;}
  .home-top .sp{flex:1;}
  .user-btn{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;font-weight:700;}
  .user-av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#0A0C12;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;}
  .hello-eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-2);}
  .hello{font-size:30px;font-weight:800;letter-spacing:-0.02em;margin:4px 0 22px;}
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  @media (max-width:640px){ .tiles{grid-template-columns:1fr;gap:10px;} .hello{font-size:26px;} .home-top .sync span{display:none;} .home-top .sync{padding:8px;} .user-btn span:last-child{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} }
  .tile{position:relative;display:flex;flex-direction:column;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .14s ease,border-color .14s ease;}
  .tile:hover{border-color:var(--line-2);transform:translateY(-2px);}
  .tile:active{transform:scale(.99);}
  .tile::before{content:"";position:absolute;right:-50px;top:-50px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,var(--tc) 0%,transparent 70%);opacity:.16;pointer-events:none;}
  .tile-head{display:flex;align-items:center;gap:12px;}
  .tile-icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .tile-icon svg{width:26px;height:26px;}
  .tile-name{font-size:17px;font-weight:800;letter-spacing:-0.01em;}
  .tile-desc{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .tile-arrow{margin-left:auto;color:var(--faint);font-size:22px;}
  .tile-sum{font-size:13px;color:#cfd4e2;background:var(--surface-2);border-radius:12px;padding:9px 11px;line-height:1.4;min-height:38px;}
  .tile-sum b{color:var(--tc);}
  @media (max-width:640px){ .tile{padding:14px;gap:10px;} .tile-icon{width:42px;height:42px;} }
  .home-foot{margin-top:24px;font-size:12px;color:var(--faint);text-align:center;line-height:1.6;}
  .home-foot button{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12px;padding:2px;}

  /* ---------- sync pill ---------- */
  .sync{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap;}
  .sync i{width:7px;height:7px;border-radius:50%;background:var(--faint);}
  .sync[data-s=synced] i{background:var(--ok);}
  .sync[data-s=saving] i{background:var(--brand-2);animation:pulse 1s ease infinite;}
  .sync[data-s=offline] i{background:var(--warn);}
  .sync[data-s=error] i{background:var(--bad);}
  .sync[data-s=error]{color:#fca5a5;cursor:pointer;}
  .sync[data-s=local] i{background:var(--warn);}
  @keyframes pulse{50%{opacity:.35;}}

  /* ---------- app view ---------- */
  #appview{background:var(--abg,#000);}
  .abar{position:absolute;top:0;left:0;right:0;height:calc(var(--bar-h) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 8px 0;display:flex;align-items:center;gap:8px;background:var(--abg,#0A0C12);border-bottom:1px solid rgba(255,255,255,.07);z-index:3;}
  .abar-btn{height:30px;display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#e8eaf0;border-radius:9px;padding:0 10px;font-size:12.5px;font-weight:700;}
  .abar-btn:hover{background:rgba(255,255,255,.09);}
  .abar-btn svg{width:15px;height:15px;}
  .abar-title{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;min-width:0;}
  .abar-title .ic{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .abar-title .ic svg{width:14px;height:14px;}
  .abar-title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .abar .sp{flex:1;}
  .abar .sync{background:transparent;border-color:rgba(255,255,255,.08);}
  @media (max-width:520px){ .abar .sync span,.abar-btn .lbl{display:none;} .abar .sync{padding:5px 8px;} }
  .frames{position:absolute;top:calc(var(--bar-h) + env(safe-area-inset-top));left:0;right:0;bottom:env(safe-area-inset-bottom);}
  .frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--abg,#000);}
  .frames iframe.on{display:block;}
  .frame-wait{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--muted);font-size:13px;}
  .frame-wait.on{display:flex;}
  .banner{position:absolute;left:50%;top:calc(var(--bar-h) + env(safe-area-inset-top) + 10px);transform:translateX(-50%);z-index:4;display:none;align-items:center;gap:10px;background:#1d2335;border:1px solid var(--line-2);border-radius:14px;padding:8px 8px 8px 14px;font-size:13px;box-shadow:0 14px 40px rgba(0,0,0,.5);max-width:calc(100% - 20px);}
  .banner.on{display:flex;}
  .banner button{border:0;border-radius:9px;padding:7px 11px;font-weight:800;font-size:12.5px;background:var(--brand-2);color:#0A0C12;white-space:nowrap;}

  /* ---------- modal ---------- */
  .mscrim{position:fixed;inset:0;background:rgba(3,4,8,.66);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;}
  .mbox{background:var(--surface);border:1px solid var(--line-2);border-radius:20px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.6);}
  .mbox h2{margin:0 0 6px;font-size:18px;}
  .mbox p{color:var(--muted);font-size:13.5px;line-height:1.55;margin:0 0 12px;}
  .mbox .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
  .mbox .acts .btn{flex:1;min-width:140px;}
  .menu-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;font-size:14px;font-weight:700;}
  .menu-item small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px;}
  .menu-item.danger{color:var(--bad);}
  .urlbox{display:flex;gap:6px;margin:10px 0 14px;}
  .urlbox input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:10px;font-size:13px;color:var(--text);}
  .howto{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.55;color:#cfd4e2;margin-top:8px;}
  .howto b{color:var(--text);}
  .htoast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--line-2);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:120;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center;}
</style>
</head>
<body>

<div class="screen on" id="splash"><div class="logo"><div class="logo-mark" data-icon="hub"></div><div class="logo-name">DecoSoft Hub</div></div><div class="spin"></div></div>

<!-- ===================== LOGIN ===================== -->
<div class="screen" id="login"><div class="scroll">
  <div class="login-card">
    <div class="logo"><div class="logo-mark" data-icon="hub"></div><div><div class="logo-name">DecoSoft Hub</div><div class="logo-sub">seus apps num lugar só</div></div></div>
    <form class="lbox" id="loginForm" autocomplete="on" novalidate>
      <h1 id="lTitle">Entrar</h1>
      <div class="sub" id="lSub">Use seu usuário e senha.</div>
      <div class="err" id="lErr" role="alert"></div>
      <div class="fld"><label for="lUser">E-mail ou usuário</label><input id="lUser" name="username" type="text" inputmode="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="voce@gmail.com" required></div>
      <div class="fld"><label for="lPass">Senha</label><div class="pw"><input id="lPass" name="password" type="password" autocomplete="current-password" required><button type="button" id="lShow">mostrar</button></div></div>
      <div class="fld" id="lPass2Wrap" style="display:none"><label for="lPass2">Repita a senha</label><input id="lPass2" type="password" autocomplete="new-password"></div>
      <button class="btn btn-main" id="lGo" type="submit">Entrar</button>
      <div class="switch-mode" style="margin-top:10px"><button type="button" id="lForgot" style="color:var(--muted);font-weight:600">Esqueci minha senha</button></div>
      <div class="switch-mode" id="lSwitch"></div>
    </form>
    <div class="mode-note" id="modeNote"></div>
  </div>
</div></div>

<!-- ===================== HOME ===================== -->
<div class="screen" id="home"><div class="scroll"><div class="home-wrap">
  <div class="home-top">
    <div class="logo"><div class="logo-mark" data-icon="hub"></div><div><div class="logo-name">DecoSoft Hub</div></div></div>
    <div class="sp"></div>
    <div class="sync" id="syncHome" data-s="synced"><i></i><span>Sincronizado</span></div>
    <button class="user-btn" id="userBtn"><span class="user-av" id="userAv">?</span><span id="userName"></span></button>
  </div>
  <div class="hello-eyebrow" id="helloEyebrow"></div>
  <div class="hello" id="hello"></div>
  <div class="tiles" id="tiles"></div>
  <div class="home-foot">Cada app tem o próprio endereço — abra um e toque em <b>Atalho</b> para salvar direto na tela inicial.<br><button id="footBackup">Backup completo</button> · <button id="footLogout">Sair</button></div>
</div></div></div>

<!-- ===================== APP VIEW ===================== -->
<div class="screen" id="appview">
  <div class="abar">
    <button class="abar-btn" id="btnHome" title="Voltar ao início"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span class="lbl">Início</span></button>
    <div class="abar-title"><div class="ic" id="abarIc"></div><span id="abarName"></span></div>
    <div class="sp"></div>
    <div class="sync" id="syncApp" data-s="synced"><i></i><span>Sincronizado</span></div>
    <button class="abar-btn" id="btnLink" title="Criar atalho para este app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg><span class="lbl">Atalho</span></button>
  </div>
  <div class="frames" id="frames"><div class="frame-wait" id="frameWait"><div class="spin"></div><div>Sincronizando seus dados…</div></div></div>
  <div class="banner" id="banner"><span>Atualizado em outro aparelho.</span><button id="bannerBtn">Recarregar</button></div>
</div>

<div id="modalRoot"></div>

<script type="application/json" id="apps-src">{"estudos": "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<script>\n/* ponte com o DecoSoft Hub: os dados vão para a conta do usuário (nuvem) em vez do localStorage */\nwindow.HubStore=(function(){var hub=null;try{if(window.parent&&window.parent!==window&&window.parent.DecoHub)hub=window.parent.DecoHub;}catch(e){}\nif(!hub)return null;var APP=\"estudos\";\nreturn{hub:true,blank:!!(hub.isBlank&&hub.isBlank()),userName:hub.userName?hub.userName():\"\",encrypted:!!(hub.isEncrypted&&hub.isEncrypted(APP)),peerGet:function(a){return hub.peerGet?hub.peerGet(APP,a):null;},peerUpdate:function(a,fn){return hub.peerUpdate?hub.peerUpdate(APP,a,fn):false;},getItem:function(){return hub.getItem(APP);},setItem:function(k,v){hub.setItem(APP,v);},removeItem:function(){hub.setItem(APP,null);}};})();\n<\/script>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover\">\n<title>Reta Final 2027<\/title>\n<style>\n  :root{\n    --bg:#0B0F1A; --surface:#121829; --surface-2:#182036; --surface-3:#202a45;\n    --line:rgba(255,255,255,0.08); --line-2:rgba(255,255,255,0.16);\n    --text:#EEF1F8; --muted:#8C96AD; --faint:#5A6380;\n    --accent:#FFC53D; --accent-ink:#1a1405;\n    --ok:#34D399; --warn:#FBBF24; --bad:#F87171; --closed:#38BDF8; --pend:#6B7591;\n    --r-s:8px; --r-m:12px; --r-l:18px;\n    --font:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,\"Helvetica Neue\",sans-serif;\n    --font-num:\"SF Mono\",ui-monospace,Menlo,Consolas,monospace;\n  }\n  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}\n  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);}\n  body{overflow:hidden;}\n  button,input,select,textarea{font-family:inherit;color:inherit;}\n  button{cursor:pointer;}\n  #app{display:flex;flex-direction:column;height:100%;}\n\n  /* ---------- top / nav ---------- */\n  .top{display:flex;align- u.\", \"4. Um tema por dia útil. Nunca dois. Se o dia cair, o tema anda, não acumula.\", \"5. Sábado é só erro da semana. Domingo é livre, ou simulado de quinze em quinze dias.\", null, \"A ROTINA DIÁRIA (2h30 a 3h)\", \"• 45 a 60 min de teoria — resumo, mapa ou vídeo acelerado. Não é leitura de livro.\", \"• 30 questões comentadas do tema do dia. Comentário é onde o aprendizado acontece.\", \"• 10 min anotando só os erros em uma lista única. Essa lista é o seu material de revisão.\", null, \"A REVISÃO\", \"Cada tema tem uma data de revisão calculada em D+21 na aba Cronograma. A revisão é feita no sábado mais próximo, em bloco: você refaz os erros anotados e resolve 15 questões novas daquele tema. Se o desempenho passar de 75%, o tema está fechado e não volta mais.\", null, \"REGRA DE OURO — O QUE FAZER QUANDO ATRASAR\", \"Você vai atrasar. Plantão, cansaço, vida. A regra é: o tema perdido NÃO é reposto. Você retoma no tema do dia seguinte e marca o perdido como pendente. No fim de cada bloco há uma semana de folga para varrer os pendentes. O erro do planner antigo foi tratar cada atraso como dívida acumulada — é isso que gera o cansaço que você descreveu.\", null, \"COMO PREENCHER\", \"Você só digita nas colunas com fundo amarelo: Feito, Questões, Acertos — e o mesmo na revisão. Todo o resto é fórmula e se atualiza sozinho. A aba Painel mostra onde você está.\"], \"metaTexto\": \"53 temas × 30 questões na primeira passada = 1.590. Mais 53 × 15 na revisão = 795. Mais 8 simulados de 100 questões = 800. Total de cerca de 3.200 questões até janeiro — contra as 12.662 do planner antigo.\", \"notas\": [\"Prior. P = prioridade máxima: tema que você autoavaliou como fraco antes do ENAMED ou que as bancas repetem todo ano. Se o dia apertar, o P é o que não se perde.\", \"Status: 🟢 ok acima de 75% · 🟡 revisar entre 60 e 75% · 🔴 refazer abaixo de 60% · 🟢 fechado quando a revisão passa de 75% — esse tema não volta mais.\"], \"hojeRegra\": \"Lembre da regra: tema atrasado NÃO é \nBLOCO: Combinado\nCOMBO\n- Desenvolvimento halteres | 3x8 · 8-14kg · Intervalo 45s\n- Elevação lateral | 3x10 · 3-7kg · Intervalo 45s\n\nBLOCO: Core\n- Abdominal | 3x15\n\nCARDIO: Bike — 20min nível 7-9\n\nGRUPO: (próximo grupo, se houver)\n...<\/div>\n    <button class=\"btn btn-ghost btn-full\" id=\"promptBtn\" style=\"margin-bottom:12px;\">Copiar pedido pronto para a IA (Claude/ChatGPT)<\/button>\n    <textarea id=\"pasteArea\" placeholder=\"Cole aqui o texto do treino (pode colar vários TREINO: de uma vez)...\"><\/textarea>\n    <button class=\"btn btn-accent btn-full\" id=\"parseBtn\" style=\"margin-top:12px;\">Carregar treino(s)<\/button>\n    <div class=\"feedback\" id=\"parseFeedback\"><\/div>\n  <\/div>\n<\/div>\n\n\u003C!-- ============ TREINO DETAIL ============ -->\n<div class=\"screen\" id=\"treinoDetail\">\n  <div class=\"topbar\">\n    <div class=\"backBtn\" id=\"backFromDetail\">‹<\/div>\n    <div class=\"topbar-title\" id=\"detailTopTitle\">Treino<\/div>\n  <\/div>\n\n  <div class=\"detail-header\">\n    <div class=\"detail-eyebrow\" id=\"detailEyebrow\"><\/div>\n    <div class=\"detail-subtitle\" id=\"detailSubtitle\"><\/div>\n  <\/div>\n\n  <div class=\"tabs\" id=\"groupTabs\"><\/div>\n\n  <div class=\"progress-wrap\">\n    <div class=\"progress-row\">\n      <span class=\"progress-label\" id=\"progLabel\">Progresso<\/span>\n      <span class=\"progress-count\" id=\"progCount\">0/0<\/span>\n    <\/div>\n    <div class=\"progress-bar\"><div class=\"progress-fill\" id=\"progFill\"><\/div><\/div>\n  <\/div>\n\n  <main class=\"detail-main\" id=\"detailMain\"><\/main>\n\n  <footer class=\"detail-footer\">\n    <button class=\"btn btn-ghost\" style=\"flex:1\" id=\"resetBtn\">Resetar dia<\/button>\n    <button class=\"btn btn-accent\" style=\"flex:1\" id=\"doneBtn\">Marcar tudo<\/button>\n  <\/footer>\n<\/div>\n\n<script>\n/* ===================== dados padrão ===================== */\nconst DEFAULT_WORKOUTS = [{\n  id: \"treino-16\",\n  title: \"Treino 16\",\n  foco: \"Redução de gordura / hipertrofia\",\n  nivel: \"Avançado\",\n  groups: [\n    {\n      key: \"perna\",\n      title: \"Perna / Inferiores\",\n      blocks: [\n        { label: \"Aquecimento\", combo:false, items: [\n          { name: \"Alongamento para as Pernas\", meta: \"2x20\\\" · Intervalo 10s\" },\n          { name: \"Alongamento de Quadríceps I\", meta: \"2x20\\\" · Intervalo 10s\" },\n        ]},\n        { label: \"Combinado\", combo:true, items: [\n          { name: \"Agachamento Sumô no Smith\", meta: \"3x8 · 20–40kg cada lado · Intervalo 45s\" },\n          { name: \"Cadeira Extensora Unilateral\", meta: \"3x6+12 drop · 25–55kg · Intervalo 45s\" },\n        ]},\n        { label: \"Combinado\", combo:true, items: [\n          { name: \"Leg Press 45 Pés Afastados\", meta: \"3x8 · 100–150kg · Intervalo 45s\" },\n          { name: \"Afundo com recuo no step\", meta: \"3x8 · 10–20kg um halter · Intervalo 45s\" },\n        ]},\n        { label: \"Combinado\", combo:true, items: [\n          { name: \"Agachamento Búlgaro com Halter\", meta: \"3x6 cada · 10–20kg · Intervalo 45s\" },\n          { name: \"Mesa Flexora\", meta: \"3x10 · 60–90kg · Intervalo 45s\" },\n        ]},\n        { label: \"Combinado\", combo:true, items: [\n          { name: \"Elevação de Quadril na Máquina\", meta: \"3x10 progressivo · 20/30/40kg · Intervalo 30s\" },\n          { name: \"Panturrilha no Leg Press\", meta: \"3x15 · Intervalo 30s\" },\n        ]},\n        { label: \"Core\", combo:false, items: [\n          { name: \"Abdominal Canivete\", meta: \"3x15\" },\n        ]},\n      ],\n      cardio: \"Bike Spinning — 5km, nível 7–9\"\n    },\n    {\n      key: \"peito\",\n      title: \"Peitoral, tríceps e ombro\",\n      blocks: [\n        { label: \"Aquecimento\", combo:false, items: [\n          { name: \"Mobilidade de Ombro com Cabo de Vassoura\", meta: \"2x10 · Intervalo 10s\" },\n          { name: \"Alongamento de Tríceps I\", meta: \"2x20\\\" · Intervalo 10s\" },\n        ]},\n        { label: \"Combinado\", combo:true, items: [\n          { name: \"Supino Reto com Barra Reta\", meta: \"4x8 · pegada média · Intervalo 60s · Cadência 3\\\"–2\\\"\" },\n          { name: \"Crucifixo Inclinado com Halteres\", meta: \"3x8 · 3–7kg · Intervalo 60s\" },\n        ]},\n        { label: \"Combinado\", combo:true, items: [\n          { name: \"Desenvolvimento Arnold Sentado\", meta: \"3x8 · 7–16kg cada · Intervalo 40s\" },\n          { name: \"Elevação Lateral com Halteres\", meta: \"3x10 · 3–7kg · Intervalo 40s\" },\n        ]},\n        { label: \"Combinado\", combo:true, items: [\n          { name: \"Crossover Polia Alta\", meta: \"3x10 · 2–5 barras · Intervalo 40s\" },\n          { name: \"Tríceps Testa na Polia com Corda\", meta: \"3x10 · Intervalo 40s\" },\n        ]},\n        { label: \"Combinado\", combo:true, items: [\n          { name: \"Tríceps na Polia com Corda\", meta: \"3x10 · 20–35kg · Intervalo 40s\" },\n          { name: \"Tríceps Francês Unilateral com Halteres\", meta: \"3x10 · 10–20kg · Intervalo 40s\" },\n        ]},\n        { label: \"Core\", combo:false, items: [\n          { name: \"Abdominal Cruzado\", meta: \"3x20\" },\n        ]},\n      ],\n      cardio: \"Esteira Sprint — 10 tiros de 30\\\" a 10–16km/h · Intervalo 30s\"\n    },\n    {\n      key: \"dorso\",\n      title: \"Dorsais\",\n      blocks: [\n        { label: \"Aquecimento\", combo:false, items: [\n          { name: \"Alongamento Dorsal I\", meta: \"2x20\\\" · Intervalo 10s\" },\n        ]},\n        { label: \"Combinado\", combo:true, items: [\n          { name: \"Puxador (Pulldown) Frente Barra Romana\", meta: \"4x8 · 15–45kg · Intervalo 40s\" },\n          { name: \"Rosca Martelo com Halteres\", meta: \"4x8 · 8–16kg · Intervalo 40s\" },\n        ]},\n        { label: \"Combinado\", combo:true, items: [\n          { name: \"Remada Baixa Unilateral Neutra\", meta: \"4x8 · 20–40kg · Intervalo 40s\" },\n          { name: \"Rosca Inversa com Barra Reta\", meta: \"4x8 · 10–16kg · Intervalo 40s\" },\n        ]},\n        { label: \"Combinado\", combo:true, items: [\n          { name: \"Remada Curvada com Barra Reta (Pegada Supinada)\", meta: \"4x8 · 15–30kg · Intervalo 40s\" },\n          { name: \"Rosca Direta Barra W\", meta: \"4x8 · 7–16kg · Intervalo 40s\" },\n        ]},\n        { label: \"Combinado\", combo:true, items: [\n          { name: \"Face Pull\", meta: \"4x10 · 15–30kg · Intervalo 40s\" },\n          { name: \"Rosca Direta na Polia Baixa com Corda\", meta: \"3x10 · Intervalo 40s\" },\n        ]},\n        { label: \"Core\", combo:false, items: [\n          { name: \"Abdominal Infra com peso em suspensão\", meta: \"3x20\" },\n        ]},\n      ],\n      cardio: \"Esteira Sprint — 10 tiros de 30\\\" a 10–16km/h · Intervalo 30s\"\n    }\n  ]\n}];\n\n/* ===================== estado ===================== */\nconst STORAGE_KEY = \"treinos-app-v1\";\nconst STORE = window.HubStore || window.localStorage;\nfunction esc(s){ return String(s == null ? \"\" : s).replace(/[&<>\"']/g, c => ({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c])); }\nlet APP = { workouts: [], checks: {}, history: {} };\nlet currentTreinoId = null;\nlet currentGroupKey = null;\nlet saveTimer = null;\n\nfunction todayKey(d = new Date()){\n  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');\n  return `${y}-${m}-${day}`;\n}\nfunction slugify(s){\n  return s.toString().toLowerCase().normalize(\"NFD\").replace(/[\\u0300-\\u036f]/g,\"\")\n    .replace(/[^a-z0-9]+/g,\"-\").replace(/(^-|-$)/g,\"\") || (\"id-\" + Date.now());\n}\n\nfunction showToast(msg, isError){\n  let t = document.getElementById(\"toast\");\n  if(!t){\n    t = document.createElement(\"div\");\n    t.id = \"toast\";\n    t.style.cssText = \"position:fixed;left:16px;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:999;padding:12px 14px;border-radius:12px;font-size:13px;font-weight:600;text-align:center;transition:opacity .25s;\";\n    document.body.appendChild(t);\n  }\n  t.style.background = isError ? \"rgba(248,113,113,0.16)\" : \"rgba(74,222,128,0.16)\";\n  t.style.color = isError ? \"#f87171\" : \"#4ade80\";\n  t.style.border = \"1px solid \" + (isError ? \"rgba(248,113,113,0.35)\" : \"rgba(74,222,128,0.35)\");\n  t.textContent = msg;\n  t.style.opacity = \"1\";\n  clearTimeout(t._hideTimer);\n  t._hideTimer = setTimeout(() => { t.style.opacity = \"0\"; }, 2600);\n}\n\nconst BLANK = !!(window.HubStore && window.HubStore.blank);\nasync function loadState(){\n  let raw = null;\n  try{\n    raw = STORE.getItem(STORAGE_KEY);\n    if(raw){ APP = JSON.parse(raw); }\n  }catch(e){ console.warn(\"Treinos: dados salvos ilegíveis, começando do padrão\", e); raw = null; }\n  if(!APP || typeof APP !== \"object\") APP = {};\n  if(!Array.isArray(APP.workouts)) APP.workouts = [];\n  if(!raw && !BLANK){ APP.workouts = JSON.parse(JSON.stringify(DEFAULT_WORKOUTS)); }\n  if(!APP.checks) APP.checks = {};\n  if(!APP.history) APP.history = {};\n  if(!APP.untony || typeof APP.untony !== \"object\") APP.untony = { on: false, dias: [0,1,2,3,4] };\n  if(!Array.isArray(APP.untony.dias)) APP.untony.dias = [0,1,2,3,4];\n  rollDay();\n}\n\n/* as marcações valem só para o dia: num dia novo o treino começa desmarcado */\nfunction rollDay(){\n  const t = todayKey();\n  if(APP.checksDate !== t){\n    APP.checks = {};\n    APP.checksDate = t;\n  }\n}\nfunction syncTodayHistory(){\n  const any = Object.keys(APP.checks).some(k => APP.checks[k]);\n  if(any) APP.history[todayKey()] = true; else delete APP.history[todayKey()];\n}\n\nasync function persist(){\n  try{\n    STORE.setItem(STORAGE_KEY, JSON.stringify(APP));\n    return true;\n  }catch(e){\n    console.error(\"erro ao salvar\", e);\n    return false;\n  }\n}\n\nfunction saveState(){\n  clearTimeout(saveTimer);\n  saveTimer = setTimeout(async () => {\n    const ok = await persist();\n    if(!ok){\n      // tenta novamente uma vez após um instante\n      setTimeout(async () => {\n        const retryOk = await persist();\n        showToast(retryOk ? \"Salvo\" : \"Não consegui salvar — os dados podem se perder ao fechar\", !retryOk);\n      }, 800);\n    }\n  }, 300);\n}\n\n/* ===================== parser da linguagem de treino ===================== */\nfunction parseWorkoutText(raw){\n  const lines = raw.split(/\\r?\\n/);\n  const workouts = [];\n  let workout = null;\n  let group = null;\n  let block = null;\n\n  for(let rawLine of lines){\n    const line = rawLine.trim();\n    if(!line) continue;\n\n    if(/^TREINO:/i.test(line)){\n      const name = line.replace(/^TREINO:/i,\"\").trim();\n      workout = { id: slugify(\"treino-\" + name), title: /^treino\\b/i.test(name) ? name : \"Treino \" + name, foco:\"\", nivel:\"\", groups: [] };\n      workouts.push(workout);\n      group = null; block = null;\n      continue;\n    }\n    if(!workout) continue; // ignora tudo antes de TREINO:\n\n    if(/^FOCO:/i.test(line)){ workout.foco = line.replace(/^FOCO:/i,\"\").trim(); continue; }\n    if(/^NIVEL:/i.test(line)){ workout.nivel = line.replace(/^NIVEL:/i,\"\").trim(); continue; }\n\n    if(/^GRUPO:/i.test(line)){\n      const title = line.replace(/^GRUPO:/i,\"\").trim();\n      group = { key: slugify(title) + \"-\" + workout.groups.length, title, blocks: [], cardio: \"\" };\n      workout.groups.push(group);\n      block = null;\n      continue;\n    }\n    if(!group) continue; // ignora linhas fora de um GRUPO\n\n    if(/^BLOCO:/i.test(line)){\n      const label = line.replace(/^BLOCO:/i,\"\").trim();\n      block = { label, combo:false, items: [] };\n      group.blocks.push(block);\n      continue;\n    }\n    if(/^COMBO$/i.test(line)){\n      if(block) block.combo = true;\n      continue;\n    }\n    if(/^CARDIO:/i.test(line)){\n      group.cardio = line.replace(/^CARDIO:/i,\"\").trim();\n      continue;\n    }\n    if(line.startsWith(\"-\")){\n      if(!block){ block = { label: \"Exercícios\", combo:false, items: [] }; group.blocks.push(block); }\n      const body = line.replace(/^-/,\"\").trim();\n      const [name, meta] = body.split(\"|\").map(s => s ? s.trim() : \"\");\n      block.items.push({ name: name || body, meta: meta || \"\" });\n      continue;\n    }\n  }\n\n  if(!workouts.length) return { error: \"Não encontrei a linha 'TREINO:'. Confira o formato.\" };\n  const empty = workouts.filter(w => !w.groups.length || !w.groups.some(g => g.blocks.some(b => b.items.length)));\n  if(empty.length) return { error: \"Em \\\"\" + empty[0].title + \"\\\" não encontrei nenhum 'GRUPO:' com exercícios (linhas começando com '-').\" };\n  return { workouts };\n}\n\n/* ===================== navegação ===================== */\nfunction showScreen(id){\n  document.querySelectorAll(\".screen\").forEach(s => s.classList.remove(\"active\"));\n  document.getElementById(id).classList.add(\"active\");\n}\n\n/* ===================== HOME ===================== */\nfunction renderHome(){\n  const h = new Date().getHours();\n  const eyebrow = h < 12 ? \"Bom dia\" : (h < 18 ? \"Boa tarde\" : \"Boa noite\");\n  document.getElementById(\"greetingEyebrow\").textContent = eyebrow;\n\n  const letters = [\"S\",\"T\",\"Q\",\"Q\",\"S\",\"S\",\"D\"];\n  const now = new Date();\n  const day = now.getDay(); // 0=domingo\n  const diffToMonday = (day === 0 ? -6 : 1) - day;\n  const monday = new Date(now);\n  monday.setDate(now.getDate() + diffToMonday);\n\n  const strip = document.getElementById(\"weekStrip\");\n  strip.innerHTML = \"\";\n  for(let i=0;i<7;i++){\n    const d = new Date(monday);\n    d.setDate(monday.getDate() + i);\n    const key = todayKey(d);\n    const isToday = key === todayKey(now);\n    const done = !!APP.history[key];\n\n    const col = document.createElement(\"div\");\n    col.className = \"day-col\";\n    col.innerHTML = `<div class=\"day-letter\">${letters[i]}<\/div>\n      <div class=\"day-dot${isToday ? \" today\":\"\"}${done ? \" done\":\"\"}\">${d.getDate()}<\/div>`;\n    strip.appendChild(col);\n  }\n}\n\ndocument.getElementById(\"openTreinos\").onclick = () => {\n  showScreen(\"treinosList\");\n  renderTreinosList();\n};\ndocument.getElementById(\"backFromList\").onclick = () => {\n  showScreen(\"home\");\n  renderHome();\n};\n\n/* ===================== LISTA DE TREINOS ===================== */\ndocument.querySelectorAll(\".sub-tab\").forEach(tab => {\n  tab.onclick = () => {\n    document.querySelectorAll(\".sub-tab\").forEach(t => t.classList.remove(\"active\"));\n    document.querySelectorAll(\".sub-panel\").forEach(p => p.classList.remove(\"active\"));\n    tab.classList.add(\"active\");\n    document.getElementById(\"panel-\" + tab.dataset.subtab).classList.add(\"active\");\n  };\n});\n\nfunction renderTreinosList(){\n  const panel = document.getElementById(\"panel-lista\");\n  panel.innerHTML = \"\";\n  if(!APP.workouts.length){\n    const e = document.createElement(\"div\");\n    e.className = \"treino-card\";\n    e.style.cursor = \"pointer\";\n    e.innerHTML = '<div class=\"name\">Nenhum treino ainda<\/div><div class=\"meta\">Toque aqui (ou em \"Add treino\"), cole o texto do seu treino e ele aparece aqui.<\/div>';\n    e.onclick = () => document.querySelector('.sub-tab[data-subtab=\"add\"]').click();\n    panel.appendChild(e);\n  }\n  APP.workouts.forEach(w => {\n    const card = document.createElement(\"div\");\n    card.className = \"treino-card\";\n    card.innerHTML = `\n      <div class=\"eyebrow\">${esc(w.foco || \"\")}${w.nivel ? \" · \" + esc(w.nivel) : \"\"}<\/div>\n      <div class=\"name\">${esc(w.title)}<\/div>\n      <div class=\"meta\">${w.groups.length} grupo${w.groups.length !== 1 ? \"s\" : \"\"} muscular${w.groups.length !== 1 ? \"es\" : \"\"}<\/div>\n      <button class=\"del\">excluir<\/button>\n    `;\n    card.onclick = (e) => {\n      if(e.target.classList.contains(\"del\")) return;\n      openTreinoDetail(w.id);\n    };\n    const delBtn = card.querySelector(\".del\");\n    if(delBtn){\n      delBtn.onclick = (e) => {\n        e.stopPropagation();\n        if(confirm(`Excluir \"${w.title}\"? Isso não pode ser desfeito.`)){\n          APP.workouts = APP.workouts.filter(x => x.id !== w.id);\n          saveState();\n          renderTreinosList();\n        }\n      };\n    }\n    panel.appendChild(card);\n  });\n}\n\ndocument.getElementById(\"backFromDetail\").onclick = () => {\n  showScreen(\"treinosList\");\n  renderTreinosList();\n};\n\n/* ===================== ADD TREINO ===================== */\ndocument.getElementById(\"parseBtn\").onclick = () => {\n  const raw = document.getElementById(\"pasteArea\").value;\n  const fb = document.getElementById(\"parseFeedback\");\n  const result = parseWorkoutText(raw);\n\n  if(result.error){\n    fb.className = \"feedback err\";\n    fb.textContent = \"⚠ \" + result.error;\n    return;\n  }\n\n  result.workouts.forEach(wk => {\n    const existingIdx = APP.workouts.findIndex(w => w.id === wk.id);\n    if(existingIdx >= 0){ APP.workouts[existingIdx] = wk; }\n    else{ APP.workouts.push(wk); }\n  });\n  saveState();\n\n  fb.className = \"feedback ok\";\n  fb.textContent = result.workouts.length === 1\n    ? `✓ \"${result.workouts[0].title}\" carregado com ${result.workouts[0].groups.length} grupo(s).`\n    : `✓ ${result.workouts.length} treinos carregados: ${result.workouts.map(w => w.title).join(\", \")}.`;\n  document.getElementById(\"pasteArea\").value = \"\";\n\n  setTimeout(() => {\n    document.querySelector('.sub-tab[data-subtab=\"lista\"]').click();\n    renderTreinosList();\n  }, 900);\n};\n\n/* ===================== DETALHE DO TREINO ===================== */\nfunction itemId(workoutId, groupKey, blockIdx, itemIdx){\n  return `${workoutId}::${groupKey}::${blockIdx}::${itemIdx}`;\n}\n\nfunction openTreinoDetail(workoutId){\n  rollDay();\n  currentTreinoId = workoutId;\n  const w = APP.workouts.find(x => x.id === workoutId);\n  currentGroupKey = w.groups[0].key;\n\n  document.getElementById(\"detailTopTitle\").textContent = w.title;\n  document.getElementById(\"detailEyebrow\").textContent = (w.foco || \"\") + (w.nivel ? \" — \" + w.nivel : \"\");\n  document.getElementById(\"detailSubtitle\").textContent = \"toca no exercício pra marcar feito\";\n\n  renderGroupTabs();\n  renderDetailMain();\n  updateProgress();\n  showScreen(\"treinoDetail\");\n}\n\nfunction renderGroupTabs(){\n  const w = APP.workouts.find(x => x.id === currentTreinoId);\n  const tabsEl = document.getElementById(\"groupTabs\");\n  tabsEl.innerHTML = \"\";\n  w.groups.forEach(g => {\n    const btn = document.createElement(\"div\");\n    btn.className = \"tab\" + (g.key === currentGroupKey ? \" active\" : \"\");\n    btn.textContent = g.title.split(\" / \")[0].split(\",\")[0];\n    btn.onclick = () => {\n      currentGroupKey = g.key;\n      renderGroupTabs();\n      renderDetailMain();\n      updateProgress();\n    };\n    tabsEl.appendChild(btn);\n  });\n}\n\nfunction renderDetailMain(){\n  const w = APP.workouts.find(x => x.id === currentTreinoId);\n  const group = w.groups.find(g => g.key === currentGroupKey);\n  const main = document.getElementById(\"detailMain\");\n  main.innerHTML = \"\";\n\n  group.blocks.forEach((block, bIdx) => {\n    const blockEl = document.createElement(\"div\");\n    blockEl.className = \"block\";\n\n    const labelEl = document.createElement(\"div\");\n    labelEl.className = \"block-label\";\n    labelEl.textContent = block.label;\n    blockEl.appendChild(labelEl);\n\n    block.items.forEach((item, iIdx) => {\n      const id = itemId(currentTreinoId, currentGroupKey, bIdx, iIdx);\n      const checked = !!APP.checks[id];\n\n      const exEl = document.createElement(\"div\");\n      exEl.className = \"ex\" + (checked ? \" checked\" : \"\");\n\n      const checkEl = document.createElement(\"div\");\n      checkEl.className = \"check\" + (checked ? \" on\" : \"\");\n      checkEl.innerHTML = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#14171c\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\/polyline><\/svg>';\n\n      const bodyEl = document.createElement(\"div\");\n      bodyEl.className = \"ex-body\";\n      const tagHtml = block.combo && iIdx === 0\n        ? '<span class=\"combo-tag\">Alterne<\/span><br>'\n        : (block.combo ? '<span class=\"combo-tag\" style=\"visibility:hidden\">Alterne<\/span><br>' : '');\n      bodyEl.innerHTML = tagHtml + `<div class=\"ex-name\">${esc(item.name)}<\/div>` + (item.meta ? `<div class=\"ex-meta\">${esc(item.meta)}<\/div>` : '');\n\n      const toggle = () => {\n        rollDay();\n        const newVal = !APP.checks[id];\n        if(newVal) APP.checks[id] = true; else delete APP.checks[id];\n        syncTodayHistory();\n        saveState();\n        renderDetailMain();\n        updateProgress();\n      };\n      checkEl.onclick = toggle;\n      bodyEl.onclick = toggle;\n\n      exEl.appendChild(checkEl);\n      exEl.appendChild(bodyEl);\n      blockEl.appendChild(exEl);\n    });\n\n    main.appendChild(blockEl);\n  });\n\n  if(group.cardio){\n    const cardioEl = document.createElement(\"div\");\n    cardioEl.className = \"cardio\";\n    cardioEl.innerHTML = `<b>Cardio final<\/b> · ${esc(group.cardio)}`;\n    main.appendChild(cardioEl);\n  }\n}\n\nfunction countAll(){\n  const w = APP.workouts.find(x => x.id === currentTreinoId);\n  const group = w.groups.find(g => g.key === currentGroupKey);\n  let total = 0, done = 0;\n  group.blocks.forEach((block, bIdx) => {\n    block.items.forEach((item, iIdx) => {\n      total++;\n      if(APP.checks[itemId(currentTreinoId, currentGroupKey, bIdx, iIdx)]) done++;\n    });\n  });\n  return { total, done };\n}\n\nfunction updateProgress(){\n  const w = APP.workouts.find(x => x.id === currentTreinoId);\n  const group = w.groups.find(g => g.key === currentGroupKey);\n  const { total, done } = countAll();\n  document.getElementById(\"progCount\").textContent = `${done}/${total}`;\n  document.getElementById(\"progFill\").style.width = (total ? (done/total*100) : 0) + \"%\";\n  document.getElementById(\"progLabel\").textContent = group.title;\n}\n\ndocument.getElementById(\"resetBtn\").onclick = () => {\n  const w = APP.workouts.find(x => x.id === currentTreinoId);\n  const group = w.groups.find(g => g.key === currentGroupKey);\n  group.blocks.forEach((block, bIdx) => {\n    block.items.forEach((item, iIdx) => {\n      delete APP.checks[itemId(currentTreinoId, currentGroupKey, bIdx, iIdx)];\n    });\n  });\n  syncTodayHistory();\n  saveState();\n  renderDetailMain();\n  updateProgress();\n};\n\ndocument.getElementById(\"doneBtn\").onclick = () => {\n  rollDay();\n  const w = APP.workouts.find(x => x.id === currentTreinoId);\n  const group = w.groups.find(g => g.key === currentGroupKey);\n  group.blocks.forEach((block, bIdx) => {\n    block.items.forEach((item, iIdx) => {\n      APP.checks[itemId(currentTreinoId, currentGroupKey, bIdx, iIdx)] = true;\n    });\n  });\n  APP.history[todayKey()] = true;\n  saveState();\n  renderDetailMain();\n  updateProgress();\n};\n\n/* ===================== init ===================== */\nconst AI_PROMPT = `Monte meu treino de academia e me responda SÓ no formato abaixo, sem nenhum outro texto (pode repetir o bloco TREINO: para vários treinos):\n\nTREINO: <número ou nome>\nFOCO: <objetivo>\nNIVEL: <iniciante/intermediário/avançado>\n\nGRUPO: <grupo muscular do dia>\nBLOCO: Aquecimento\n- <exercício> | <séries x reps · carga · intervalo>\n\nBLOCO: Combinado\nCOMBO\n- <exercício A> | <séries x reps · carga · intervalo>\n- <exercício B> | <séries x reps · carga · intervalo>\n\nBLOCO: Core\n- <exercício> | <séries x reps>\n\nCARDIO: <aparelho — tempo/intensidade>\n\nGRUPO: <próximo grupo do mesmo treino, se houver>\n...\n\nRegras: cada exercício numa linha começando com \"-\"; use \"|\" para separar o nome dos detalhes; COMBO logo abaixo de BLOCO marca exercícios feitos alternados.\n\nMeus dados e objetivo: `;\ndocument.getElementById(\"promptBtn\").onclick = async () => {\n  try{ await navigator.clipboard.writeText(AI_PROMPT); showToast(\"Pedido copiado — cole na IA, complete com seus dados e traga a resposta para cá.\"); }\n  catch(e){ const ta = document.getElementById(\"pasteArea\"); ta.value = AI_PROMPT; ta.select(); showToast(\"Copie o texto que apareceu no campo (Ctrl+C) e depois apague-o daqui.\", true); }\n};\n\n/* chave: levar o treino para o Drello UNTONY (o hub faz a ponte) */\nfunction renderInteg(){\n  if(!(window.HubStore && window.HubStore.hub)) return;\n  document.getElementById(\"integCard\").style.display = \"\";\n  const on = document.getElementById(\"integOn\");\n  on.checked = !!APP.untony.on;\n  const days = document.getElementById(\"integDays\");\n  days.classList.toggle(\"on\", on.checked);\n  days.innerHTML = '<span class=\"lbl\">Dias de treino<\/span>';\n  [\"S\",\"T\",\"Q\",\"Q\",\"S\",\"S\",\"D\"].forEach((l, i) => {\n    const b = document.createElement(\"button\");\n    b.type = \"button\";\n    b.textContent = l;\n    b.title = [\"segunda\",\"terça\",\"quarta\",\"quinta\",\"sexta\",\"sábado\",\"domingo\"][i];\n    b.className = APP.untony.dias.includes(i) ? \"on\" : \"\";\n    b.setAttribute(\"aria-pressed\", b.className ? \"true\" : \"false\");\n    b.onclick = () => {\n      APP.untony.dias = APP.untony.dias.includes(i) ? APP.untony.dias.filter(x => x !== i) : APP.untony.dias.concat(i).sort();\n      saveState(); renderInteg();\n    };\n    days.appendChild(b);\n  });\n}\ndocument.getElementById(\"integOn\").addEventListener(\"change\", e => {\n  APP.untony.on = e.target.checked;\n  saveState(); renderInteg();\n  showToast(APP.untony.on ? \"Treino ligado ao Drello UNTONY.\" : \"Treino desligado do UNTONY (tarefas não feitas foram retiradas).\");\n});\n\n(async function init(){\n  if(window.HubStore && window.HubStore.userName) document.getElementById(\"greetingName\").textContent = window.HubStore.userN " width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z\"/><\/svg>'\n};\n\nfunction h(tag, attrs, ...children){\n  attrs = attrs || {};\n  const e = document.createElement(tag);\n  for(const k in attrs){\n    const v = attrs[k];\n    if(v===null || v===undefined) continue;\n    if(k==='class') e.className = v;\n    else if(k==='html') e.innerHTML = v;\n    else if(k.startsWith('on') && typeof v==='function') e.addEventListener(k.slice(2), v);\n    else e.setAttribute(k, v);\n  }\n  for(const c of children.flat(Infinity)){\n    if(c===null || c===undefined || c===false) continue;\n    e.appendChild(typeof c==='string' || typeof c==='number' ? document.createTextNode(c) : c);\n  }\n  return e;\n}\nfunction icon(name){ const s = document.createElement('span'); s.style.display='inline-flex'; s.innerHTML = ICONS[name]||''; return s; }\n\n/* ============================================================\n   CONSTANTS\n============================================================ */\nconst STORAGE_KEY = 'drello_untony_v1';\nconst STORE = window.HubStore || window.localStorage;\nconst WEEKDAY_LABELS = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];\nconst MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];\nconst MESES_ABREV = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];\nconst THEMES = {\n  red:    { label:'Vermelho neon', primary:'#E5253A', primary2:'#FF4D5E' },\n  green:  { label:'Verde neon',    primary:'#16E37E', primary2:'#5CFFB0' },\n  orange: { label:'Laranja neon',  primary:'#FF7A2E', primary2:'#FFB454' },\n  blue:   { label:'Azul claro neon', primary:'#22B8F0', primary2:'#7DE0FF' }\n};\n\n/* ============================================================\n   DATE HELPERS\n============================================================ */\nfunction uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }\nfunction isoLocal(d){\n  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');\n  return y+'-'+m+'-'+day;\n}\nfunction mondayOf(d){\n  const day = d.getDay();\n  const diff = (day===0 ? -6 : 1-day);\n  const monday = new Date(d);\n  monday.setDate(d.getDate()+diff);\n  monday.setHours(0,0,0,0);\n  return monday;\n}\nfunction getWeekDates(offsetWeeks){\n  const monday = mondayOf(new Date());\n  monday.setDate(monday.getDate() + offsetWeeks*7);\n  const dates = [];\n  for(let i=0;i<7;i++){ const d = new Date(monday); d.setDate(monday.getDate()+i); dates.push(d); }\n  return dates;\n}\nfunction fmtDayMonth(d){ return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); }\nfunction isToday(d){ return isoLocal(d) === isoLocal(new Date()); }\nfunction fmtWeekRange(dates){\n  const d1 = dates[0], d5 = dates[dates.length-1];\n  if(d1.getMonth()===d5.getMonth()){\n    return d1.getDate()+' – '+d5.getDate()+' de '+MESES[d1.getMonth()];\n  }\n  return d1.getDate()+' '+MESES_ABREV[d1.getMonth()]+' – '+d5.getDate()+' '+MESES_ABREV[d5.getMonth()];\n}\n\n/* ============================================================\n   STATE\n============================================================ */\nlet state = null;\nlet ui = { weekOffset: 0 };\n\nfunction defaultState(){\n  return {\n    templates: [ {id:uid(), text:'Academia'}, {id:uid(), text:'Skincare'} ],\n    tasksByDate: {},\n    weather: { city:'', lat:-1.4558, lon:-48.4902, label:'Belém, PA - Campina' },\n    profile: { name:'', photo:null, color:'#E5253A' },\n    theme: { accent:'red', mode:'dark' },\n    goalPct: 80\n  };\n}\nfunction loadState(){\n  try{\n    const raw = STORE.getItem(STORAGE_KEY);\n    if(raw){\n      const parsed = JSON.parse(raw);\n      if(parsed && Array.isArray(parsed.templates) && parsed.tasksByDate){\n        if(!parsed.weather) parsed.weather = { city:'', lat:-1.4558, lon:-48.4902, label:'Belém, PA - Campina' };\n        if(!parsed.profile) parsed.profile = { name:'', photo:null, color:'#E5253A' };\n        if(!parsed.theme) parsed.theme = { accent:'red', mode:'dark' };\n        if(typeof parsed.goalPct !== 'number') parsed.goalPct = 80;\n        Object.keys(parsed.tasksByDate).forEach(k=>{ if(!Array.isArray(parsed.tasksByDate[k]) || !parsed.tasksByDate[k].length) delete parsed.tasksByDate[k]; });\n        return parsed;\n      }\n    }\n  }catch(e){ console.warn('Drello UNTONY: não foi possível ler o storage local, iniciando novo estado.', e); }\n  return defaultState();\n}\nlet saveTimer=null;\nfunction save(){\n  clearTimeout(saveTimer);\n  saveTimer = setTimeout(()=>{\n    try{ STORE.setItem(STORAGE_KEY, JSON.stringify(state)); }\n    catch(e){ console.error('Drello UNTONY: falha ao salvar no localStorage', e); showToast('Não foi possível salvar. Considere exportar um backup.'); }\n  }, 150);\n}\nfunction tasksFor(iso){\n  if(!state.tasksByDate[iso]) state.tasksByDate[iso] = [];\n  return state.tasksByDate[iso];\n}\nfunction peekTasks(iso){ return state.tasksByDate[iso] || []; }\n\nstate = loadState();\nlet weatherCache = { list:[], cityTz:0, cityName:'', loading:false, error:null };\n\n/* ============================================================\n   RENDER: chrome\n============================================================ */\ndocument.getElementById('brandMark').innerHTML = ICONS.flame;\ndocument.getElementById('btnPrevWeek').innerHTML = ICONS.chevronLeft;\ndocument.getElementById('btnNextWeek').innerHTML = ICONS.chevronRight;\ndocument.getElementById('btnExport').innerHTML = ICONS.download;\ndocument.getElementById('btnImport').innerHTML = ICONS.upload;\ndocument.getElementById('btnPrint').innerHTML = ICONS.printer;\ndocument.getElementById('btnPrint').addEventListener('click', ()=> window.print());\ndocument.getElementById('btnProfile').addEventListener('click', openProfileModal);\n\nfunction initialsFrom(name){\n  const parts = (name||'').trim().split(/\\s+/).filter(Boolean);\n  if(parts.length===0) return '?';\n  if(parts.length===1) return parts[0].slice(0,2).toUpperCase();\n  return (parts[0][0]+parts[1][0]).toUpperCase();\n}\n\nfunction renderProfile(){\n  const btn = document.getElementById('btnProfile');\n  btn.innerHTML = '';\n  const p = state.profile;\n  if(p.photo){\n    const img = h('img', {src:p.photo, alt:'Foto de perfil'});\n    btn.appendChild(img);\n    btn.style.background = 'transparent';\n  } else {\n    btn.style.background = p.color || 'var(--red)';\n    btn.textContent = p.name ? initialsFrom(p.name) : '';\n    if(!p.name) btn.innerHTML = ICONS.camera;\n  }\n}\n\nfunction applyTheme(){\n  const t = THEMES[state.theme.accent] || THEMES.red;\n  document.documentElement.style.setProperty('--red', t.primary);\n  document.documentElement.style.setProperty('--red-2', t.primary2);\n  document.documentElement.setAttribute('data-theme', state.theme.mode==='light' ? 'light' : 'dark');\n}\n\nfunction downscaleImage(file, maxW, cb){\n  const reader = new FileReader();\n  reader.onload = e=>{\n    const img = new Image();\n    img.onload = ()=>{\n      let w = img.width, hgt = img.height;\n      if(w > maxW){ hgt = Math.round(hgt*maxW/w); w = maxW; }\n      const canvas = document.createElement('canvas');\n      canvas.width = w; canvas.height = hgt;\n      canvas.getContext('2d').drawImage(img,0,0,w,hgt);\n      cb(canvas.toDataURL('image/jpeg', 0.85));\n    };\n    img.src = e.target.result;\n  };\n  reader.readAsDataURL(file);\n}\n\nfunction openProfileModal(){\n  const p = state.profile;\n  let pendingPhoto = p.photo;\n  const origTheme = Object.assign({}, state.theme);\n  let savedProfile = false;\n  openModal(modal=>{\n    modal.appendChild(h('div', {class:'modal__header'}, h('h3',{},'Meu perfil'), h('button',{class:'icon-btn',onclick:closeModal}, icon('x'))));\n    const body = h('div', {class:'modal__body'});\n\n    const nameInput = h('input', {type:'text', class:'add-input', placeholder:'Seu nome'});\n    nameInput.value = p.name || '';\n\n    const preview = h('div', {class:'avatar-preview', style:'background:'+(p.color||'#E5253A')+';'});\n    function refreshPreview(){\n      preview.innerHTML = '';\n      preview.style.background = pendingPhoto ? 'transparent' : (p.color||'#E5253A');\n      if(pendingPhoto){ preview.appendChild(h('img', {src:pendingPhoto, alt:'Prévia'})); }\n      else { preview.textContent = nameInput.value ? initialsFrom(nameInput.value) : ''; if(!nameInput.value) preview.innerHTML = ICONS.camera; }\n    }\n    refreshPreview();\n    nameInput.addEventListener('input', refreshPreview);\n\n    const fileInput = h('input', {type:'file', accept:'image/*', class:'file-hidden'});\n    fileInput.addEventListener('change', ()=>{\n      const f = fileInput.files[0];\n      if(!f) return;\n      downscaleImage(f, 300, dataUrl=>{ pendingPhoto = dataUrl; refreshPreview(); });\n    });\n    const uploadBtn = h('button', {class:'loc-toggle', style:'margin-top:0;', onclick:()=>fileInput.click()}, icon('camera'), h('span',{},'Escolher foto'));\n    const removeBtn = h('button', {class:'btn-text', onclick:()=>{ pendingPhoto = null; refreshPreview(); }}, 'Remover foto');\n\n    body.appendChild(h('div', {class:'avatar-row'}, preview, h('div', {class:'avatar-row-actions'}, uploadBtn, removeBtn, fileInput)));\n    body.appendChild(h('div', {style:'margin-bottom:6px;'}, nameInput));\n\n    body.appendChild(h('div', {class:'mini-label'}, 'Cor do tema'));\n    const themeRow = h('div', {class:'theme-swatch-row'});\n    Object.keys(THEMES).forEach(key=>{\n      const t = THEMES[key];\n      const sw = h('div', {\n        class:'theme-swatch'+(state.theme.accent===key?' selected':''),\n        style:'background:'+t.primary+';box-shadow:0 0 10px '+t.primary+'aa;',\n        title:t.label,\n        html: ICONS.checkSm\n      });\n      sw.addEventListener('click', ()=>{\n        state.theme.accent = key;\n        save();\n        applyTheme();\n        themeRow.querySelectorAll('.theme-swatch').forEach(s=>s.classList.remove('selected'));\n        sw.classList.add('selected');\n      });\n      themeRow.appendChild(sw);\n    });\n    body.appendChild(themeRow);\n\n    body.appendChild(h('div', {class:'mini-label'}, 'Modo'));\n    const modeRow = h('div', {class:'mode-toggle-row'});\n    const darkBtn = h('button', {class:'mode-btn'+(state.theme.mode!=='light'?' active':'')}, icon('moon'), 'Escuro');\n    const lightBtn = h('button', {class:'mode-btn'+(state.theme.mode==='light'?' active':'')}, icon('sun'), 'Claro');\n    darkBtn.addEventListener('click', ()=>{\n      state.theme.mode = 'dark'; save(); applyTheme();\n      darkBtn.classList.add('active'); lightBtn.classList.remove('active');\n    });\n    lightBtn.addEventListener('click', ()=>{\n      state.theme.mode = 'light'; save(); applyTheme();\n      lightBtn.classList.add('active'); darkBtn.classList.remove('active');\n    });\n    modeRow.appendChild(darkBtn); modeRow.appendChild(lightBtn);\n    body.appendChild(modeRow);\n\n    modal.appendChild(body);\n\n    modal.appendChild(h('div', {class:'modal__footer'},\n      h('button', {class:'btn-text', onclick:closeModal}, 'Cancelar'),\n      h('button', {class:'btn-primary', onclick:()=>{\n        state.profile.name = nameInput.value.trim();\n        state.profile.photo = pendingPhoto;\n        savedProfile = true;\n        save();\n        closeModal();\n        renderProfile();\n      }}, 'Salvar')\n    ));\n  }, ()=>{\n    if(!savedProfile && (state.theme.accent!==origTheme.accent || state.theme.mode!==origTheme.mode)){\n      state.theme = origTheme; applyTheme(); save();\n    }\n  });\n}\n\nfunction renderHeader(){\n  const dates = getWeekDates(ui.weekOffset);\n  document.getElementById('weekRange').textContent = fmtWeekRange(dates);\n  const todayBtn = document.getElementById('btnToday');\n  todayBtn.classList.toggle('current', ui.weekOffset===0);\n}\n\n/* ============================================================\n   WEATHER — Open-Meteo (sem chave de API)\n============================================================ */\nconst WMO_INFO = {\n  0:{e:'☀️',d:'Céu limpo'}, 1:{e:'🌤️',d:'Poucas nuvens'}, 2:{e:'⛅',d:'Parcialmente nublado'}, 3:{e:'☁️',d:'Nublado'},\n  45:{e:'🌫️',d:'Neblina'}, 48:{e:'🌫️',d:'Neblina com geada'},\n  51:{e:'🌦️',d:'Garoa fraca'}, 53:{e:'🌦️',d:'Garoa moderada'}, 55:{e:'🌦️',d:'Garoa forte'},\n  56:{e:'🌦️',d:'Garoa congelante fraca'}, 57:{e:'🌦️',d:'Garoa congelante forte'},\n  61:{e:'🌧️',d:'Chuva fraca'}, 63:{e:'🌧️',d:'Chuva moderada'}, 65:{e:'🌧️',d:'Chuva forte'},\n  66:{e:'🌧️',d:'Chuva congelante fraca'}, 67:{e:'🌧️',d:'Chuva congelante forte'},\n  71:{e:'❄️',d:'Neve fraca'}, 73:{e:'❄️',d:'Neve moderada'}, 75:{e:'❄️',d:'Neve forte'}, 77:{e:'❄️',d:'Grãos de neve'},\n  80:{e:'🌦️',d:'Pancadas de chuva fracas'}, 81:{e:'🌧️',d:'Pancadas de chuva moderadas'}, 82:{e:'⛈️',d:'Pancadas de chuva violentas'},\n  85:{e:'🌨️',d:'Pancadas de neve fracas'}, 86:{e:'🌨️',d:'Pancadas de neve fortes'},\n  95:{e:'⛈️',d:'Trovoada'}, 96:{e:'⛈️',d:'Trovoada com granizo fraco'}, 99:{e:'⛈️',d:'Trovoada com granizo forte'}\n};\nfunction wmoInfo(code){ return WMO_INFO[code] || {e:'🌡️',d:'Previsão indisponível'}; }\n\nasync function fetchWeather(){\n  const w = state.weather;\n  if(w.lat==null || w.lon==null){ weatherCache.error=null; renderWeatherBadge(); return; }\n  weatherCache.loading = true; weatherCache.error = null;\n  renderWeatherBadge();\n  try{\n    const url = 'https://api.open-meteo.com/v1/forecast?latitude='+w.lat+'&longitude='+w.lon+'&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=7';\n    const res = await fetch(url);\n    const data = await res.json();\n    if(!res.ok || data.error){\n      weatherCache.error = (data && data.reason) ? data.reason : 'Erro ao buscar previsão.';\n      weatherCache.loading = false;\n      renderWeatherBadge();\n      return;\n    }\n    weatherCache.byDate = {};\n    const days = (data.daily && data.daily.time) || [];\n    days.forEach((iso,i)=>{\n      weatherCache.byDate[iso] = {\n        min: Math.round(data.daily.temperature_2m_min[i]),\n        max: Math.round(data.daily.temperature_2m_max[i]),\n        code: data.daily.weathercode[i]\n      };\n    });\n    weatherCache.cityName = w.label || '';\n    weatherCache.loading = false;\n    renderWeatherBadge();\n    renderWeekGrid();\n  }catch(err){\n    weatherCache.error = 'Falha de rede ao buscar previsão.';\n    weatherCache.loading = false;\n    renderWeatherBadge();\n    console.error('Drello UNTONY: erro ao buscar previsão do tempo', err);\n  }\n}\n\nfunction weatherForIso(iso){\n  if(!weatherCache.byDate) return null;\n  return weatherCache.byDate[iso] || null;\n}\n\nfunction renderWeatherBadge(){\n  const slot = document.getElementById('weatherBadgeSlot');\n  slot.innerHTML = '';\n  if(weatherCache.error){\n    slot.appendChild(h('button', {class:'topbar-weather', onclick:openWeatherSettingsModal, title:weatherCache.error},\n      icon('cloud'), h('span', {class:'tw-cta', style:'color:var(--red-2);'}, '⚠ Clima')\n    ));\n    return;\n  }\n  const today = weatherForIso(isoLocal(new Date()));\n  if(weatherCache.loading && !today){\n    slot.appendChild(h('button', {class:'topbar-weather', onclick:openWeatherSettingsModal}, icon('cloud'), h('span',{class:'tw-cta'},'Carregando...')));\n    return;\n  }\n  if(!today){\n    slot.appendChild(h('button', {class:'topbar-weather', onclick:openWeatherSettingsModal}, icon('cloud'), h('span',{class:'tw-cta'},'Previsão')));\n    return;\n  }\n  const info = wmoInfo(today.code);\n  slot.appendChild(h('button', {class:'topbar-weather', onclick:openWeatherSettingsModal, title:info.d},\n    h('span', {style:'font-size:18px;line-height:1;'}, info.e),\n    h('span', {class:'tw-temp'}, today.max+'°'),\n    h('span', {class:'tw-city'}, weatherCache.cityName)\n  ));\n}\n\nfunction openWeatherSettingsModal(){\n  const w = state.weather;\n  let pendingLat = w.lat, pendingLon = w.lon;\n  openModal(modal=>{\n    modal.appendChild(h('div', {class:'modal__header'}, h('h3',{},'Previsão do tempo'), h('button',{class:'icon-btn',onclick:closeModal}, icon('x'))));\n    const body = h('div', {class:'modal__body'});\n    body.appendChild(h('div', {style:'font-size:12px;color:var(--text-2);margin-bottom:10px;'},\n      'Sem chave de API — os dados vêm da Open-Meteo, gratuita e sem cadastro. Escolha a cidade que quer acompanhar.'));\n\n    if(weatherCache.error){\n      body.appendChild(h('div', {style:'background:rgba(255,77,94,0.12);border:1px solid var(--red-2);border-radius:var(--radius-s);padding:9px 10px;margin-bottom:12px;font-size:12px;color:var(--red-2);'},\n        h('div', {style:'font-weight:800;margin-bottom:2px;'}, 'Não foi possível carregar a previsão:'),\n        weatherCache.error,\n        h('div', {},\n          h('button', {class:'btn-text', style:'padding:6px 0 0;color:var(--red-2);', onclick:()=>{ fetchWeather(); closeModal(); }}, 'Tentar novamente')\n        )\n      ));\n    }\n\n    const cityInput = h('input', {type:'text', class:'add-input', placeholder:'Cidade, ex: Belém,BR'});\n    if(pendingLat==null){ cityInput.value = w.city || ''; }\n    else {\n      cityInput.disabled = true;\n      const usingSaved = (pendingLat===w.lat && pendingLon===w.lon && w.label);\n      cityInput.placeholder = usingSaved ? 'Usando: '+w.label+' (pode trocar)' : 'Usando localização atual ('+pendingLat.toFixed(2)+', '+pendingLon.toFixed(2)+')';\n    }\n    body.appendChild(cityInput);\n    body.appendChild(h('div', {style:'font-size:11px;color:var(--text-3);margin-top:5px;'},\n      'Bairros pequenos nem sempre aparecem na busca — se não achar, tente só o nome da cidade, ou use \"minha localização atual\" pra pegar o ponto exato.'));\n\n    const resultsList = h('div', {style:'margin-top:8px;'});\n    body.appendChild(resultsList);\n\n    const status = h('div', {class:'weather-modal-status'});\n    const locBtn = h('button', {class:'loc-toggle'}, icon('pin'), h('span',{}, pendingLat==null ? 'Usar minha localização atual' : 'Usar cidade em vez disso'));\n    locBtn.addEventListener('click', ()=>{\n      resultsList.innerHTML = '';\n      if(pendingLat!=null){\n        pendingLat = null; pendingLon = null;\n        cityInput.disabled = false; cityInput.value=''; cityInput.placeholder = 'Cidade, ex: Belém,BR';\n        locBtn.querySelector('span').textContent = 'Usar minha localização atual';\n        status.textContent = ''; status.classList.remove('err');\n        return;\n      }\n      if(!navigator.geolocation){ status.textContent = 'Geolocalização não é suportada neste navegador.'; status.classList.add('err'); return; }\n      status.textContent = 'Obtendo localização...'; status.classList.remove('err');\n      navigator.geolocation.getCurrentPosition(pos=>{\n        pendingLat = pos.coords.latitude; pendingLon = pos.coords.longitude;\n        cityInput.value=''; cityInput.disabled = true;\n        cityInput.placeholder = 'Usando localização atual ('+pendingLat.toFixed(2)+', '+pendingLon.toFixed(2)+')';\n        locBtn.querySelector('span').textContent = 'Usar cidade em vez disso';\n        status.textContent = 'Localização obtida.';\n      }, ()=>{\n        status.textContent = 'Não foi possível obter a localização.'; status.classList.add('err');\n      }, {timeout:8000});\n    });\n    body.appendChild(locBtn);\n    body.appendChild(status);\n    modal.appendChild(body);\n\n    function applyLocation(r, queryUsed){\n      const label = r.name + (r.admin1 ? ', '+r.admin1 : '') + (r.country ? ' - '+r.country : '');\n      state.weather = { city:queryUsed, lat:r.latitude, lon:r.longitude, label:label };\n      save(); closeModal(); fetchWeather();\n    }\n\n    function renderResultsList(results, queryUsed){\n      resultsList.innerHTML = '';\n      if(results.length<=1) return;\n      resultsList.appendChild(h('div', {style:'font-size:11.5px;color:var(--text-2);font-weight:700;margin-bottom:6px;'}, 'Vários lugares com esse nome — qual é o seu?'));\n      results.forEach(r=>{\n        const line = r.name + (r.admin1 ? ', '+r.admin1 : '') + (r.country ? ' - '+r.country : '');\n        const row = h('button', {class:'loc-toggle', style:'margin-top:5px;justify-content:flex-start;'}, icon('pin'), h('span',{}, line));\n        row.addEventListener('click', ()=> applyLocation(r, queryUsed));\n        resultsList.appendChild(row);\n      });\n    }\n\n    async function geocode(query){\n      const res = await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(query)+'&count=10&language=pt&format=json');\n      const data = await res.json();\n      return (data && data.results) || [];\n    }\n\n    const saveBtn = h('button', {class:'btn-primary', onclick: async ()=>{\n      if(pendingLat!=null){\n        const usingSavedDefault = (pendingLat===w.lat && pendingLon===w.lon && w.label);\n        state.weather = { city:'', lat:pendingLat, lon:pendingLon, label: usingSavedDefault ? w.label : 'Minha localização atual' };\n        save(); closeModal(); fetchWeather();\n        return;\n      }\n      const cityText = cityInput.value.trim();\n      if(!cityText){ status.textContent = 'Digite uma cidade ou use sua localização atual.'; status.classList.add('err'); return; }\n      resultsList.innerHTML = '';\n      status.textContent = 'Buscando...'; status.classList.remove('err');\n      saveBtn.disabled = true;\n      try{\n        let results = await geocode(cityText);\n        let queryUsed = cityText;\n        if(!results.length && cityText.includes(',')){\n          const broader = cityText.split(',').slice(1).join(',').trim();\n          if(broader){\n            status.textContent = '\"'+cityText+'\" não encontrado, tentando \"'+broader+'\"...';\n            results = await geocode(broader);\n            queryUsed = broader;\n          }\n        }\n        saveBtn.disabled = false;\n        if(!results.length){\n          status.textContent = 'Não encontramos esse lugar. Tente só o nome da cidade (sem o bairro) ou use sua localização atual.';\n          status.classList.add('err');\n          return;\n        }\n        status.textContent = '';\n        if(results.length===1){\n          applyLocation(results[0], queryUsed);\n        } else {\n          renderResultsList(results, queryUsed);\n        }\n      }catch(err){\n        status.textContent = 'Erro ao buscar cidade. Tente novamente.'; status.classList.add('err');\n        saveBtn.disabled = false;\n        console.error(err);\n      }\n    }}, 'Salvar');\n\n    modal.appendChild(h('div', {class:'modal__footer'},\n      h('button', {class:'btn-text', onclick:closeModal}, 'Cancelar'),\n      saveBtn\n    ));\n  });\n}\n\n/* ============================================================\n   GOAL / REWARD\n============================================================ */\nfunction renderGoalChip(){\n  const slot = document.getElementById('goalChipSlot');\n  slot.innerHTML = '';\n  slot.appendChild(h('button', {class:'goal-chip', onclick:openGoalSettingsModal, title:'Meta diária de conclusão'},\n    icon('target'), h('span',{}, 'Meta '+state.goalPct+'%')\n  ));\n}\n\nfunction openGoalSettingsModal(){\n  let pending = state.goalPct;\n  openModal(modal=>{\n    modal.appendChild(h('div', {class:'modal__header'}, h('h3',{},'Meta diária'), h('button',{class:'icon-btn',onclick:closeModal}, icon('x'))));\n    const body = h('div', {class:'modal__body'});\n    body.appendChild(h('div', {style:'font-size:12px;color:var(--text-2);margin-bottom:4px;'},\n      'Quando você bater essa porcentagem de tarefas concluídas no dia, ganha a estrelinha e o selo de meta batida.'));\n    const numInput = h('input', {type:'number', min:'10', max:'100', step:'5'});\n    numInput.value = pending;\n    const rangeInput = h('input', {type:'range', min:'10', max:'100', step:'5'});\n    rangeInput.value = pending;\n    numInput.addEventListener('input', ()=>{ pending = Math.max(10, Math.min(100, Number(numInput.value)||80)); rangeInput.value = pending; });\n    rangeInput.addEventListener('input', ()=>{ pending = Number(rangeInput.value); numInput.value = pending; });\n    body.appendChild(h('div', {class:'goal-input-row'}, rangeInput, numInput, h('span',{},'%')));\n    modal.appendChild(body);\n    modal.appendChild(h('div', {class:'modal__footer'},\n      h('button', {class:'btn-text', onclick:closeModal}, 'Cancelar'),\n      h('button', {class:'btn-primary', onclick:()=>{\n        state.goalPct = pending;\n        save();\n        closeModal();\n        renderGoalChip();\n        renderWeekGrid();\n      }}, 'Salvar')\n    ));\n  });\n}\n\nfunction celebrateGoal(colEl){\n  showToast('🎉 Meta do dia batida! Mandou bem.');\n  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n  const host = colEl.querySelector('.day-col__head');\n  const burst = h('div', {class:'goal-burst'});\n  [-60,-25,0,25,60].forEach((ang,i)=>{\n    const star = h('span', {class:'goal-star', html: ICONS.star, style:'--ang:'+ang+'deg;animation-delay:'+(i*0.03)+'s;'});\n    burst.appendChild(star);\n  });\n  host.appendChild(burst);\n  setTimeout(()=>burst.remove(), 950);\n}\n\n/* ============================================================\n   RENDER: templates\n============================================================ */\nfunction renderTemplates(){\n  const bar = document.getElementById('templatesBar');\n  bar.innerHTML = '';\n  bar.appendChild(h('span', {class:'templates-label'}, 'Hábitos'));\n  state.templates.forEach(t=>{\n    const xBtn = h('span', {class:'chip-x', html: ICONS.x});\n    xBtn.addEventListener('click', e=>{\n      e.stopPropagation();\n      if(confirm('Remover o hábito \"'+t.text+'\" da lista rápida? (as tarefas já criadas não são afetadas)')){\n        state.templates = state.templates.filter(x=>x.id!==t.id);\n        save(); renderTemplates();\n      }\n    });\n    const chip = h('div', {class:'chip', onclick:()=> openDayPickerModal(t.text, {title:'Aplicar hábito', verb:'Aplicar', defaultAll:true})}, t.text, xBtn);\n    bar.appendChild(chip);\n  });\n  const addInput = h('input', {type:'text', placeholder:'Novo hábito...'});\n  const addBtn = h('button', {html: ICONS.plus, onclick: addTemplate});\n  const addWrap = h('div', {class:'chip-add'}, addInput, addBtn);\n  bar.appendChild(addWrap);\n  addInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addTemplate(); } });\n  function addTemplate(){\n    const v = addInput.value.trim();\n    if(!v) return;\n    state.templates.push({id:uid(), text:v});\n    save(); renderTemplates();\n  }\n}\n\n/* ============================================================\n   RENDER: week grid\n============================================================ */\nfunction renderWeekGrid(){\n  renderHeader();\n  const grid = document.getElementById('weekGrid');\n  grid.innerHTML = '';\n  const dates = getWeekDates(ui.weekOffset);\n  dates.forEach((d,i)=> grid.appendChild(renderDayColumn(d, WEEKDAY_LABELS[i])));\n}\n\nlet weekTransitioning = false;\nfunction transitionWeek(mode, applyFn){\n  if(weekTransitioning) return;\n  const grid = document.getElementById('weekGrid');\n  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n  if(reduced){ applyFn(); renderWeekGrid(); return; }\n  weekTransitioning = true;\n  grid.classList.remove('wg-exit-l','wg-exit-r','wg-exit-f','wg-enter-l','wg-enter-r','wg-enter-f');\n  void grid.offsetWidth;\n  const exitCls = mode==='next' ? 'wg-exit-l' : mode==='prev' ? 'wg-exit-r' : 'wg-exit-f';\n  const enterCls = mode==='next' ? 'wg-enter-r' : mode==='prev' ? 'wg-enter-l' : 'wg-enter-f';\n  grid.classList.add(exitCls);\n  setTimeout(()=>{\n    applyFn();\n    renderWeekGrid();\n    grid.classList.remove(exitCls);\n    void grid.offsetWidth;\n    grid.classList.add(enterCls);\n    let done = false;\n    function finishEnter(){\n      if(done) return;\n      done = true;\n      grid.classList.remove(enterCls);\n      grid.removeEventListener('animationend', finishEnter);\n      weekTransitioning = false;\n    }\n    grid.addEventListener('animationend', finishEnter);\n    setTimeout(finishEnter, 400);\n  }, 150);\n}\n\nfunction renderDayColumn(date, label){\n  const iso = isoLocal(date);\n  const today = isToday(date);\n  const col = h('div', {class:'day-col'+(today?' today':''), 'data-iso':iso});\n\n  const head = h('div', {class:'day-col__head'});\n  const nameRow = h('div', {class:'day-col__name'}, label);\n  if(today) nameRow.appendChild(h('span', {class:'today-badge'}, 'HOJE'));\n  head.appendChild(nameRow);\n  const dateRow = h('div', {class:'day-col__date'}, fmtDayMonth(date));\n  const wx = weatherForIso(iso);\n  if(wx){\n    const info = wmoInfo(wx.code);\n    dateRow.appendChild(h('span', {class:'day-weather', title:info.d}, h('span',{style:'font-size:17px;'}, info.e), wx.max+'°'));\n  }\n  head.appendChild(dateRow);\n  col.appendChild(head);\n\n  const body = h('div', {class:'day-col__body'});\n  const list = peekTasks(iso);\n  if(list.length===0){\n    body.appendChild(h('div', {class:'day-empty'}, today ? 'Nada por aqui ainda. Bora começar?' : 'Sem tarefas.'));\n  } else {\n    list.forEach(task=> body.appendChild(renderTask(iso, task, col)));\n  }\n  col.appendChild(body);\n\n  const addWrap = h('div', {class:'day-col__add'});\n  const addInput = h('input', {type:'text', class:'add-input', placeholder:'+ Adicionar tarefa'});\n  addInput.addEventListener('keydown', e=>{\n    if(e.key==='Enter'){\n      e.preventDefault();\n      const v = addInput.value.trim();\n      if(!v) return;\n      const newTask = {id:uid(), text:v, done:false};\n      tasksFor(iso).push(newTask);\n      addInput.value='';\n      save();\n      insertTaskNode(col, iso, newTask);\n    }\n  });\n  addWrap.appendChild(addInput);\n  col.appendChild(addWrap);\n\n  if(list.length){\n    const done = list.filter(t=>t.done).length;\n    const pct = Math.round(done/list.length*100);\n    const goalHit = pct >= state.goalPct;\n    const footer = h('div', {class:'day-col__footer'},\n      h('div', {class:'footer-label'}, h('span',{}, done+'/'+list.length+' concluídas'), h('span',{}, pct+'%')),\n      h('div', {class:'footer-bar'+(goalHit?' goal-hit':'')}, h('div', {style:'width:'+pct+'%;'})),\n      goalHit ? h('div', {class:'footer-goal'}, icon('star'), h('span',{},'Meta batida!')) : null\n    );\n    col.appendChild(footer);\n  }\n\n  return col;\n}\n\nfunction insertTaskNode(colEl, iso, task){\n  const body = colEl.querySelector('.day-col__body');\n  const empty = body.querySelector('.day-empty');\n  if(empty) empty.remove();\n  const node = renderTask(iso, task, colEl);\n  node.classList.add('entering');\n  body.appendChild(node);\n  updateFooter(colEl, iso);\n}\n\nfunction renderTask(iso, task, colEl){\n  const checkBtn = h('button', {class:'task__check'+(task.done?' checked':''), html: ICONS.check, title: task.done?'Marcar como não concluída':'Marcar como concluída'});\n  const checkWrap = h('span', {class:'check-wrap'}, checkBtn);\n  const textEl = h('div', {class:'task__text'+(task.done?' done':''), title:task.text}, task.text);\n\n  const dupBtn = h('button', {html: ICONS.copy, title:'Duplicar para outro(s) dia(s)', onclick:()=>{\n    openDayPickerModal(task.text, {title:'Duplicar tarefa', verb:'Duplicar', excludeIso:iso});\n  }});\n  const delBtn = h('button', {html: ICONS.trash, title:'Excluir', onclick:()=>{\n    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    const finish = ()=>{\n      const arr = tasksFor(iso);\n      const idx = arr.findIndex(t=>t.id===task.id);\n      if(idx>-1) arr.splice(idx,1);\n      if(!arr.length) delete state.tasksByDate[iso];\n      save();\n      taskEl.remove();\n s = attrs || {};\n  const e = document.createElement(tag);\n  for(const k in attrs){\n    const v = attrs[k];\n    if(v===null || v===undefined) continue;\n    if(k==='class') e.className = v;\n    else if(k==='html') e.innerHTML = v;\n    else if(k.startsWith('on') && typeof v==='function') e.addEventListener(k.slice(2), v);\n    else e.setAttribute(k, v);\n  }\n  for(const c of children.flat(Infinity)){\n    if(c===null || c===undefined || c===false) continue;\n    e.appendChild(typeof c==='string' || typeof c==='number' ? document.createTextNode(c) : c);\n  }\n  return e;\n}\nfunction icon(name, extraClass){\n  const span = document.createElement('span');\n  if(extraClass) span.className = extraClass;\n  span.innerHTML = ICONS[name] || '';\n  span.style.display = 'inline-flex';\n  return span;\n}\n\n/* ============================================================\n   CONSTANTS\n============================================================ */\nconst STORAGE_KEY = 'drello_state_v1';\nconst STORE = window.HubStore || window.localStorage;\n\nconst LABEL_PALETTE = [\n  {c:'#FF6B5B', n:'Urgente'},\n  {c:'#FFB454', n:'Atenção'},\n  {c:'#34D399', n:'Tranquilo'},\n  {c:'#22D3EE', n:'Ideia'},\n  {c:'#7C5CFF', n:'Prioridade'},\n  {c:'#F472B6', n:'Pessoal'}\n];\n\nconst AVATAR_COLORS = ['#7C5CFF','#22D3EE','#FF6B5B','#34D399','#FFB454','#F472B6'];\n\nconst AVATAR_PRESETS = [\n  { id:'forte', label:'Forte de boné', svg:\n    '<svg viewBox=\"0 0 64 64\" xmlns=\"http://www.w3.org/2000/svg\"><defs><clipPath id=\"clipForte\"><circle cx=\"32\" cy=\"32\" r=\"32\"/><\/clipPath><\/defs><g clip-path=\"url(#clipForte)\">'+\n    '<rect width=\"64\" height=\"64\" fill=\"#1B2130\"/>'+\n    '<ellipse cx=\"32\" cy=\"74\" rx=\"30\" ry=\"20\" fill=\"#374151\"/>'+\n    '<rect x=\"27\" y=\"39\" width=\"10\" height=\"9\" fill=\"#C68642\"/>'+\n    '<circle cx=\"32\" cy=\"29\" r=\"16\" fill=\"#C68642\"/>'+\n    '<path d=\"M16 27a16 16 0 0 1 32 0c-3-3-8-4-16-4s-13 1-16 4Z\" fill=\"#1F2937\"/>'+\n
