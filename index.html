bel:'Cabelo afro', svg:\n    '<svg viewBox=\"0 0 64 64\" xmlns=\"http://www.w3.org/2000/svg\"><defs><clipPath id=\"clipAfro\"><circle cx=\"32\" cy=\"32\" r=\"32\"/><\/clipPath><\/defs><g clip-path=\"url(#clipAfro)\">'+\n    '<rect width=\"64\" height=\"64\" fill=\"#1a2b24\"/>'+\n    '<circle cx=\"32\" cy=\"26\" r=\"20\" fill=\"#161210\"/>'+\n    '<ellipse cx=\"32\" cy=\"74\" rx=\"27\" ry=\"20\" fill=\"#34D399\"/>'+\n    '<rect x=\"27\" y=\"39\" width=\"10\" height=\"8\" fill=\"#5C3A21\"/>'+\n    '<circle cx=\"32\" cy=\"29\" r=\"15\" fill=\"#5C3A21\"/>'+\n    '<circle cx=\"26\" cy=\"29\" r=\"1.7\" fill=\"#1a120c\"/><circle cx=\"38\" cy=\"29\" r=\"1.7\" fill=\"#1a120c\"/>'+\n    '<path d=\"M25 36 Q32 41 39 36\" stroke=\"#2e1c10\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\"/>'+\n    '<\/g><\/svg>' }\n];\n\nconst BG_PRESETS = [\n  {type:'gradient', value:'linear-gradient(135deg,#7C5CFF,#22D3EE)'},\n  {type:'gradient', value:'linear-gradient(135deg,#FF6B5B,#FFB454)'},\n  {type:'gradient', value:'linear-gradient(135deg,#0EA5E9,#22D3EE)'},\n  {type:'gradient', value:'linear-gradient(135deg,#34D399,#0EA5E9)'},\n  {type:'gradient', value:'linear-gradient(135deg,#F472B6,#7C5CFF)'},\n  {type:'gradient', value:'linear-gradient(135deg,#FBBF24,#FF6B5B)'},\n  {type:'gradient', value:'linear-gradient(160deg,#0A0D14,#2A3145)'},\n  {type:'gradient', value:'linear-gradient(135deg,#111827,#374151)'}\n];\n\n/* ============================================================\n   STATE\n============================================================ */\nlet state = null;\nlet ui = {\n  activeCardModal: null, // {boardId, listId, cardId}\n  searchTerm: '',\n  dragCard: null, // {cardId, listId, boardId}\n  dragList: null  // {listId}\n};\n\nfunction uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }\nfunction todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }\nfunction pad3(n){ return String(n).padStart(3,'0'); }\n\nfunction defaultState(){\n  const c1 = uid(), c2 = uid(), c3 = uid();\n  return {\n    profile: { name:'André', color:'#7C5CFF', avatarId:null },\n    seq: 4,\n    activeBoardId: null,\n    boards: [\n      {\n        id: uid(),\n        name: 'Quadro Geral',\n        background: BG_PRESETS[0],\n        lists: [\n          { id: uid(), name:'A Fazer', cards:[\n            { id:c1, code:'DRL-001', title:'Conhecer o DréLLo', desc:'Clique em um cartão para ver descrição, prazo, etiquetas e checklist.', labels:['#22D3EE'], due:null, checklist:[{text:'Arrastar um cartão entre listas', done:false},{text:'Trocar o plano de fundo do quadro', done:false}], createdAt: Date.now() }\n          ]},\n          { id: uid(), name:'Fazendo', cards:[\n            { id:c2, code:'DRL-002', title:'Organizar a semana', desc:'', labels:['#FFB454'], due: todayStr(), checklist:[], createdAt: Date.now() }\n          ]},\n          { id: uid(), name:'Feito', cards:[\n            { id:c3, code:'DRL-003', title:'Criar meu primeiro quadro', desc:'', labels:['#34D399'], due:null, done:true, checklist:[{text:'Item concluído',done:true}], createdAt: Date.now() }\n          ]}\n        ]\n      }\n    ]\n  };\n}\n\nfunction loadState(){\n  try{\n    const raw = STORE.getItem(STORAGE_KEY);\n    if(raw){\n      const parsed = JSON.parse(raw);\n      if(parsed && Array.isArray(parsed.boards)) return parsed;\n    }\n  }catch(e){ console.warn('DréLLo: não foi possível ler o storage local, iniciando novo estado.', e); }\n  const fresh = defaultState();\n  return fresh;\n}\n\nlet saveTimer = null;\nfunction save(){\n  setSyncText('salvando...');\n  clearTimeout(saveTimer);\n  saveTimer = setTimeout(()=>{\n    try{\n      STORE.setItem(STORAGE_KEY, JSON.stringify(state));\n      setSyncText('salvo');\n    }catch(e){\n      setSyncText('erro ao salvar');\n      console.error('DréLLo: falha ao salvar no localStorage', e);\n    }\n  }, 150);\n}\nfunction setSyncText(t){ const el = document.getElementById('syncText'); if(el) el.textContent = t; }\n\nfunction getActiveBoard(){\n  return state.boards.find(b=>b.id===state.activeBoardId) || null;\n}\n\n/* ============================================================\n   INIT\n============================================================ */\nstate = loadState();\nif(!state.activeBoardId && state.boards.length) state.activeBoardId = state.boards[0].id;\n\n/* ============================================================\n   RENDER: shell chrome (icons, profile)\n============================================================ */\ndocument.getElementById('iconSearch').innerHTML = ICONS.search;\ndocument.getElementById('brandMark').innerHTML = ICONS.star4;\ndocument.getElementById('btnHamburger').innerHTML = ICONS.hamburger;\ndocument.getElementById('iconPlusSide').innerHTML = ICONS.plus;\ndocument.getElementById('btnExport').innerHTML = ICONS.download;\ndocument.getElementById('btnImport').innerHTML = ICONS.upload;\n\nfunction renderProfile(){\n  const av = document.getElementById('profileAvatar');\n  const preset = AVATAR_PRESETS.find(a=>a.id===state.profile.avatarId);\n  if(preset){\n    av.style.background = 'transparent';\n    av.innerHTML = avatarSvgInstance(preset);\n  } else {\n    av.innerHTML = '';\n    av.style.background = state.profile.color;\n    av.textContent = initialsFrom(state.profile.name);\n  }\n  document.getElementById('profileNameLabel').textContent = state.profile.name || 'Perfil';\n}\nfunction initialsFrom(name){\n  const parts = (name||'').trim().split(/\\s+/).filter(Boolean);\n  if(parts.length===0) return '?';\n  if(parts.length===1) return parts[0].slice(0,2).toUpperCase();\n  return (parts[0][0]+parts[1][0]).toUpperCase();\n}\nfunction avatarSvgInstance(preset){\n  const originalId = 'clip'+preset.id.charAt(0).toUpperCase()+preset.id.slice(1);\n  const uniqueId = originalId+'-'+Math.random().toString(36).slice(2,8);\n  return preset.svg.split(originalId).join(uniqueId);\n}\n\n/* ============================================================\n   RENDER: sidebar\n============================================================ */\nfunction renderSidebar(){\n  const list = document.getElementById('boardList');\n  list.innerHTML = '';\n  document.getElementById('boardCount').textContent = state.boards.length;\n  state.boards.forEach(b=>{\n    const row = h('div', {class:'board-row' + (b.id===state.activeBoardId?' active':''), onclick:()=>{\n      state.activeBoardId = b.id;\n      renderAll();\n      closeSidebarMobile();\n    }},\n      h('span', {class:'board-swatch', style: bgCss(b.background)}),\n      h('span', {}, b.name)\n    );\n    list.appendChild(row);\n  });\n}\n\nfunction bgCss(bg){\n  if(!bg) return 'background:'+BG_PRESETS[0].value+';';\n  if(bg.type==='image') return `background-image:url(\"${bg.value}\");`;\n  if(bg.type==='color') return `background:${bg.value};`;\n  return `background-image:${bg.value};`;\n}\n\n/* ============================================================\n   RENDER: board canvas\n============================================================ */\nfunction renderBoardCanvas(){\n  const canvas = document.getElementById('boardCanvas');\n  canvas.innerHTML = '';\n  const board = getActiveBoard();\n\n  if(!board){\n    canvas.removeAttribute('style');\n    canvas.appendChild(h('div', {class:'empty-canvas'},\n      h('h2', {}, 'Nenhum quadro ainda'),\n      h('p', {}, 'Crie um quadro para começar a organizar suas tarefas.'),\n      h('button', {class:'btn-primary', onclick: openNewBoardModal}, 'Criar quadro')\n    ));\n    return;\n  }\n\n  canvas.setAttribute('style', bgCss(board.background));\n\n  const topbar = h('div', {class:'board-topbar'});\n  const titleInput = h('input', {\n    type:'text', class:'board-title', value: board.name,\n    onchange: e=>{ board.name = e.target.value.trim() || board.name; renderSidebar(); save(); },\n    onkeydown: e=>{ if(e.key==='Enter') e.target.blur(); }\n  });\n  titleInput.value = board.name;\n  topbar.appendChild(titleInput);\n\n  const actions = h('div', {class:'board-actions'},\n    h('button', {class:'ghost-btn', onclick: openBackgroundModal}, icon('palette'), 'Fundo'),\n    h('button', {class:'ghost-btn danger', onclick: ()=>deleteBoard(board.id)}, icon('trash'), 'Excluir quadro')\n  );\n  topbar.appendChild(actions);\n  canvas.appendChild(topbar);\n\n  const row = h('div', {class:'lists-row', id:'listsRow'});\n  board.lists.forEach(l=> row.appendChild(renderList(board, l)));\n  row.appendChild(renderAddListColumn(board));\n  canvas.appendChild(row);\n}\n\nfunction renderAddListColumn(board){\n  const wrap = h('div', {});\n  const showForm = ()=>{\n    const nameInput = h('input', {type:'text', class:'qa-input', placeholder:'Nome da lista', style:'min-height:auto;'});\n    const form = h('div', {class:'list-add-form'},\n      nameInput,\n      h('div', {class:'qa-actions'},\n        h('button', {class:'btn-primary', onclick:()=>{\n          const v = nameInput.value.trim();\n          if(v){ board.lists.push({id:uid(), name:v, cards:[]}); save(); renderBoardCanvas(); }\n        }}, 'Adicionar lista'),\n        h('button', {class:'btn-text', onclick:()=> renderBoardCanvas()}, 'Cancelar')\n      )\n    );\n    wrap.replaceWith(form);\n    nameInput.focus();\n    nameInput.addEventListener('keydown', e=>{\n      if(e.key==='Enter'){ e.preventDefault(); form.querySelector('.btn-primary').click(); }\n      if(e.key==='Escape'){ renderBoardCanvas(); }\n    });\n  };\n  wrap.appendChild(h('button', {class:'list-add-col', onclick: showForm}, icon('plus'), 'Adicionar outra lista'));\n  return wrap;\n}\n\nfunction renderList(board, list){\n  const el = h('div', {class:'list', 'data-list-id': list.id});\n\n  el.addEventListener('dragover', e=>{ e.preventDefault(); el.classList.add('drag-over'); });\n  el.addEventListener('dragleave', ()=> el.classList.remove('drag-over'));\n  el.addEventListener('drop', e=>{\n    e.preventDefault(); el.classList.remove('drag-over');\n    if(ui.dragCard){\n      moveCardToList(board, ui.dragCard.listId, list.id, ui.dragCard.cardId, null);\n      ui.dragCard = null;\n    } else if(ui.dragList && ui.dragList.listId !== list.id){\n      reorderList(board, ui.dragList.listId, list.id);\n      ui.dragList = null;\n    }\n  });\n\n  const header = h('div', {class:'list__header'});\n  const grip = h('span', {class:'list__grip', draggable:'true', title:'Arraste para reordenar', html: ICONS.grip});\n  grip.addEventListener('dragstart', e=>{ ui.dragCard = null; ui.dragList = {listId:list.id}; e.dataTransfer.effectAllowed='move'; });\n  grip.addEventListener('dragend', ()=>{ setTimeout(()=>{ ui.dragList = null; }, 0); });\n  header.appendChild(grip);\n  const nameInput = h('input', {\n    type:'text', class:'list__name', value:list.name,\n    onchange: e=>{ list.name = e.target.value.trim() || list.name; save(); }\n  });\n  nameInput.value = list.name;\n  header.appendChild(nameInput);\n  header.appendChild(h('span', {class:'list__count'}, String(list.cards.length)));\n  header.appendChild(h('button', {class:'icon-btn list__del', title:'Excluir lista', onclick:()=>{\n    if(confirm('Excluir a lista \"'+list.name+'\" e todos os cartões dela?')){\n      board.lists = board.lists.filter(l=>l.id!==list.id);\n      save(); renderBoardCanvas();\n    }\n  }}, icon('trash')));\n  el.appendChild(header);\n\n  const cardsWrap = h('div', {class:'list__cards'});\n  const term = ui.searchTerm.trim().toLowerCase();\n  list.cards.forEach(card=>{\n    if(term && !cardMatches(card, term)) return;\n    cardsWrap.appendChild(renderCard(board, list, card));\n  });\n  el.appendChild(cardsWrap);\n\n  el.appendChild(renderQuickAdd(board, list));\n  return el;\n}\n\nfunction cardMatches(card, term){\n  return (card.title||'').toLowerCase().includes(term) || (card.desc||'').toLowerCase().includes(term) || (card.code||'').toLowerCase().includes(term);\n}\n\nfunction renderCard(board, list, card){\n  const el = h('div', {class:'card'+(card.done?' done':''), draggable:'true', onclick:()=> openCardModal(board.id, list.id, card.id)});\n  el.addEventListener('dragstart', e=>{\n    ui.dragCard = {cardId:card.id, listId:list.id, boardId:board.id};\n    el.classList.add('dragging');\n    e.dataTransfer.effectAllowed = 'move';\n  });\n  el.addEventListener('dragend', ()=>{ el.classList.remove('dragging'); setTimeout(()=>{ ui.dragCard = null; }, 0); });\n  el.addEventListener('dragover', e=>{ e.preventDefault(); e.stopPropagation(); });\n  el.addEventListener('drop', e=>{\n    e.preventDefault(); e.stopPropagation();\n    if(ui.dragCard && ui.dragCard.cardId !== card.id){\n      moveCardToList(board, ui.dragCard.listId, list.id, ui.dragCard.cardId, card.id);\n      ui.dragCard = null;\n    }\n  });\n\n  if(card.labels && card.labels.length){\n    const bar = h('div', {class:'card__labels'});\n    card.labels.forEach(c=> bar.appendChild(h('span', {class:'card__label-bar', style:'background:'+c+';'})));\n    el.appendChild(bar);\n  }\n  el.appendChild(h('span', {class:'card__code'}, card.code));\n\n  const checkBtn = h('button', {class:'card__check'+(card.done?' checked':''), title: card.done ? 'Marcar como não concluída' : 'Marcar como concluída', html: ICONS.check});\n  const checkWrap = h('span', {class:'check-wrap'}, checkBtn);\n  const titleDiv = h('div', {class:'card__title'+(card.done?' done':'')}, card.title);\n  checkBtn.addEventListener('click', e=>{\n    e.stopPropagation();\n    const turningOn = !card.done;\n    card.done = turningOn;\n    checkBtn.classList.toggle('checked', turningOn);\n    el.classList.toggle('done', turningOn);\n    titleDiv.classList.toggle('done', turningOn);\n    if(turningOn) burstStar(checkWrap);\n    save();\n  });\n  const titleRow = h('div', {class:'card__title-row'}, checkWrap, titleDiv);\n  el.appendChild(titleRow);\n\n  const meta = h('div', {class:'card__meta'});\n  if(card.due){\n    const overdue = card.due < todayStr();\n    meta.appendChild(h('span', {class:'badge' + (overdue?' badge--overdue':'')}, icon('calendar'), fmtDate(card.due)));\n  }\n  if(card.checklist && card.checklist.length){\n    const done = card.checklist.filter(i=>i.done).length;\n    const all = done === card.checklist.length;\n    meta.appendChild(h('span', {class:'badge' + (all?' badge--done':'')}, icon('check'), done+'/'+card.checklist.length));\n  }\n  if(meta.children.length) el.appendChild(meta);\n\n  return el;\n}\n\nfunction fmtDate(iso){\n  const [y,m,d] = iso.split('-');\n  return d+'/'+m;\n}\n\nfunction burstStar(container){\n  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n  const old = container.querySelector('.star-burst-set');\n  if(old) old.remove();\n  const set = h('span', {class:'star-burst-set'},\n    h('span', {class:'star-burst star-burst--main', html: ICONS.star4}),\n    h('span', {class:'star-burst star-burst--mini', html: ICONS.star4})\n  );\n  container.appendChild(set);\n  setTimeout(()=>{ if(set.parentNode) set.remove(); }, 700);\n}\n\nfunction renderQuickAdd(board, list){\n  const wrap = h('div', {class:'list__quickadd'});\n  const trigger = h('button', {class:'add-card-trigger'}, icon('plus'), 'Adicionar cartão');\n  wrap.appendChild(trigger);\n\n  trigger.addEventListener('click', ()=>{\n    const ta = h('textarea', {class:'qa-input', placeholder:'Título do cartão...', rows:'2'});\n    const form = h('div', {},\n      ta,\n      h('div', {class:'qa-actions'},\n        h('button', {class:'btn-primary', onclick: addIt}, 'Adicionar'),\n        h('button', {class:'btn-text', onclick: ()=>{ wrap.innerHTML=''; wrap.appendChild(trigger); } }, 'Cancelar')\n      )\n    );\n    wrap.innerHTML = '';\n    wrap.appendChild(form);\n    ta.focus();\n    ta.addEventListener('keydown', e=>{\n      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); addIt(); }\n      if(e.key==='Escape'){ wrap.innerHTML=''; wrap.appendChild(trigger); }\n    });\n    function addIt(){\n      const v = ta.value.trim();\n      if(!v) return;\n      state.seq += 1;\n      list.cards.push({id:uid(), code:'DRL-'+pad3(state.seq), title:v, desc:'', labels:[], due:null, checklist:[], createdAt:Date.now()});\n      save();\n      renderBoardCanvas();\n    }\n  });\n  return wrap;\n}\n\nfunction moveCardToList(board, fromListId, toListId, cardId, beforeCardId){\n  const fromList = board.lists.find(l=>l.id===fromListId);\n  const toList = board.lists.find(l=>l.id===toListId);\n  if(!fromList || !toList) return;\n  const idx = fromList.cards.findIndex(c=>c.id===cardId);\n  if(idx===-1) return;\n  const [card] = fromList.cards.splice(idx,1);\n  if(beforeCardId){\n    const insertAt = toList.cards.findIndex(c=>c.id===beforeCardId);\n    toList.cards.splice(insertAt===-1?toList.cards.length:insertAt, 0, card);\n  } else {\n    toList.cards.push(card);\n  }\n  save();\n  renderBoardCanvas();\n}\n\nfunction reorderList(board, draggedId, targetId){\n  const from = board.lists.findIndex(l=>l.id===draggedId);\n  const to = board.lists.findIndex(l=>l.id===targetId);\n  if(from===-1||to===-1) return;\n  const [l] = board.lists.splice(from,1);\n  board.lists.splice(to,0,l);\n  save();\n  renderBoardCanvas();\n}\n\nfunction deleteBoard(boardId){\n  if(state.boards.length<=1){ alert('Você precisa manter ao menos um quadro.'); return; }\n  const b = state.boards.find(x=>x.id===boardId);\n  if(!confirm('Excluir o quadro \"'+b.name+'\" e tudo dentro dele? Essa ação não pode ser desfeita.')) return;\n  state.boards = state.boards.filter(x=>x.id!==boardId);\n  if(state.activeBoardId===boardId) state.activeBoardId = state.boards[0].id;\n  save();\n  renderAll();\n}\n\n/* ============================================================\n   MODALS — generic scaffold\n============================================================ */\nfunction openModal(contentBuilder, opts){\n  opts = opts || {};\n  const root = document.getElementById('modalRoot');\n  const overlay = h('div', {class:'modal-overlay', onclick: e=>{ if(e.target===overlay) closeModal(); }});\n  const modal = h('div', {class:'modal' + (opts.wide?' modal-wide':'')});\n  overlay.appendChild(modal);\n  contentBuilder(modal);\n  root.innerHTML = '';\n  root.appendChild(overlay);\n  document.addEventListener('keydown', escHandler);\n}\nfunction escHandler(e){ if(e.key==='Escape') closeModal(); }\nfunction closeModal(){\n  const ae = document.activeElement;\n  if(ae && ae.blur && document.getElementById('modalRoot').contains(ae)) ae.blur();\n  document.getElementById('modalRoot').innerHTML = '';\n  document.removeEventListener('keydown', escHandler);\n}\n\n/* ---------- new board modal ---------- */\nfunction openNewBoardModal(){\n  let chosenBg = BG_PRESETS[Math.floor(Math.random()*BG_PRESETS.length)];\n  openModal(modal=>{\n    const nameInput = h('input', {type:'text', placeholder:'Ex: Plantões de Agosto'});\n    const grid = h('div', {class:'swatch-grid'});\n    BG_PRESETS.forEach((bg,i)=>{\n      const sw = h('div', {class:'swatch'+(i===0?' selected':''), style:'background-image:'+bg.value+';', onclick:()=>{\n        grid.querySelectorAll('.swatch').forEach(s=>s.classList.remove('selected'));\n        sw.classList.add('selected');\n        chosenBg = bg;\n      }});\n      grid.appendChild(sw);\n    });\n    modal.appendChild(h('div', {class:'modal__header'}, h('h3',{},'Novo quadro'), h('button',{class:'icon-btn',onclick:closeModal},icon('x'))));\n    modal.appendChild(h('div', {class:'modal__body'},\n      h('div', {class:'field'}, h('label',{},'Nome do quadro'), nameInput),\n      h('div', {class:'section-label'}, 'Plano de fundo'),\n      grid\n    ));\n    modal.appendChild(h('div', {class:'modal__footer'},\n      h('button', {class:'btn-text', onclick:closeModal}, 'Cancelar'),\n      h('button', {class:'btn-primary', onclick:()=>{\n        const name = nameInput.value.trim() || 'Novo quadro';\n        const board = {id:uid(), name, background:chosenBg, lists:[\n          {id:uid(), name:'A Fazer', cards:[]},\n          {id:uid(), name:'Fazendo', cards:[]},\n          {id:uid(), name:'Feito', cards:[]}\n        ]};\n        state.boards.push(board);\n        state.activeBoardId = board.id;\n        save();\n        closeModal();\n        renderAll();\n      }}, 'Criar quadro')\n    ));\n    setTimeout(()=>nameInput.focus(), 30);\n  });\n}\n\n/* ---------- background modal ---------- */\nfunction openBackgroundModal(){\n  const board = getActiveBoard();\n  if(!board) return;\n  openModal(modal=>{\n    modal.appendChild(h('div', {class:'modal__header'}, h('h3',{},'Plano de fundo do quadro'), h('button',{class:'icon-btn',onclick:closeModal},icon('x'))));\n\n    const tabs = h('div', {class:'tab-bar'});\n    const tGrad = h('button', {class:'tab-btn'}, 'Predefinidos');\n    const tColor = h('button', {class:'tab-btn'}, 'Cor sólida');\n    const tImg = h('button', {class:'tab-btn'}, 'Imagem');\n    tabs.appendChild(tGrad); tabs.appendChild(tColor); tabs.appendChild(tImg);\n\n    const panelGrad = h('div', {class:'tab-panel'});\n    const grid = h('div', {class:'swatch-grid'});\n    BG_PRESETS.forEach(bg=>{\n      const sel = board.background && board.background.type!=='image' && board.background.type!=='color' && board.background.value===bg.value;\n      const sw = h('div', {class:'swatch'+(sel?' selected':''), style:'background-image:'+bg.value+';', onclick:()=>{\n        board.background = bg; save(); closeModal(); renderAll();\n      }});\n      grid.appendChild(sw);\n    });\n    panelGrad.appendChild(grid);\n\n    const panelColor = h('div', {class:'tab-panel'});\n    const colorInput = h('input', {type:'color', value: board.background && board.background.type==='color' ? board.background.value : '#12151F'});\n    panelColor.appendChild(h('div', {class:'field'},\n      h('label',{},'Escolha uma cor sólida'),\n      h('div', {class:'colorpair'}, colorInput,\n        h('button', {class:'btn-primary', onclick:()=>{\n          board.background = {type:'color', value: colorInput.value};\n          save(); closeModal(); renderAll();\n        }}, 'Aplicar')\n      )\n    ));\n\n    const panelImg = h('div', {class:'tab-panel'});\n    const fileInput = h('input', {type:'file', accept:'image/*', class:'file-hidden'});\n    fileInput.addEventListener('change', ()=>{\n      const f = fileInput.files[0];\n      if(!f) return;\n      downscaleImage(f, dataUrl=>{\n        board.background = {type:'image', value: dataUrl};\n        save(); closeModal(); renderAll();\n      });\n    });\n    function buildImgPanel(){\n      panelImg.innerHTML = '';\n      if(board.background && board.background.type==='image'){\n        panelImg.appendChild(h('div', {style:'border-radius:var(--radius-m);overflow:hidden;height:120px;background-size:cover;background-position:center;margin-bottom:10px;background-image:url(\"'+board.background.value+'\");'}));\n        panelImg.appendChild(h('div', {style:'display:flex;gap:8px;'},\n          h('button', {class:'btn-primary', onclick:()=>fileInput.click()}, 'Trocar imagem'),\n          h('button', {class:'btn-danger', onclick:()=>{\n            board.background = BG_PRESETS[0]; save(); closeModal(); renderAll();\n          }}, 'Remover imagem')\n        ));\n      } else {\n        panelImg.appendChild(h('div', {class:'dropzone', onclick:()=>fileInput.click()},\n          icon('image'),\n          h('div',{style:'margin-top:6px;'},'Clique para escolher uma imagem do seu computador'),\n          h('div',{style:'font-size:11px;color:var(--text-3);margin-top:4px;'},'A imagem é redimensionada automaticamente e sincroniza com seus outros aparelhos.')\n        ));\n      }\n      panelImg.appendChild(fileInput);\n    }\n    buildImgPanel();\n\n    modal.appendChild(h('div', {class:'modal__body'}, tabs, panelGrad, panelColor, panelImg));\n\n    function setTab(active){\n      [tGrad,tColor,tImg].forEach(t=>t.classList.remove('active'));\n      [panelGrad,panelColor,panelImg].forEach(p=>p.classList.remove('active'));\n      active.tab.classList.add('active'); active.panel.classList.add('active');\n    }\n    tGrad.onclick = ()=>setTab({tab:tGrad, panel:panelGrad});\n    tColor.onclick = ()=>setTab({tab:tColor, panel:panelColor});\n    tImg.onclick = ()=>setTab({tab:tImg, panel:panelImg});\n\n    const currentType = board.background ? board.background.type : 'gradient';\n    if(currentType==='image') setTab({tab:tImg, panel:panelImg});\n    else if(currentType==='color') setTab({tab:tColor, panel:panelColor});\n    else setTab({tab:tGrad, panel:panelGrad});\n  }, {wide:true});\n}\n\nfunction downscaleImage(file, cb){\n  const reader = new FileReader();\n  reader.onload = e=>{\n    const img = new Image();\n    img.onload = ()=>{\n      const maxW = 1280;\n      let w = img.width, hgt = img.height;\n      if(w > maxW){ hgt = Math.round(hgt * maxW / w); w = maxW; }\n      const canvas = document.createElement('canvas');\n      canvas.width = w; canvas.height = hgt;\n      canvas.getContext('2d').drawImage(img, 0, 0, w, hgt);\n      cb(canvas.toDataURL('image/jpeg', 0.72));\n    };\n    img.src = e.target.result;\n  };\n  reader.readAsDataURL(file);\n}\n\n/* ---------- profile modal ---------- */\nfunction openProfileModal(){\n  openModal(modal=>{\n    const nameInput = h('input', {type:'text', value: state.profile.name});\n    nameInput.value = state.profile.name;\n    let chosenAvatarId = state.profile.avatarId;\n    let chosenColor = state.profile.color;\n\n    const grid = h('div', {class:'avatar-grid'});\n    const colorPick = h('div', {class:'avatar-pick'});\n\n    function buildInitialsTile(){\n      const tile = h('div', {class:'avatar-tile'+(!chosenAvatarId?' selected':'')});\n      const circle = h('div', {class:'avatar-tile__circle', style:'background:'+chosenColor+';display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;font-size:13px;color:#0A0C12;'}, initialsFrom(nameInput.value));\n      tile.appendChild(circle);\n      tile.appendChild(h('span', {}, 'Iniciais'));\n      tile.addEventListener('click', ()=>{ chosenAvatarId = null; refreshGrid(); });\n      return tile;\n    }\n    function buildPresetTile(preset){\n      const tile = h('div', {class:'avatar-tile'+(chosenAvatarId===preset.id?' selected':'')});\n      const circle = h('div', {class:'avatar-tile__circle', html: avatarSvgInstance(preset)});\n      tile.appendChild(circle);\n      tile.appendChild(h('span', {}, preset.label));\n      tile.addEventListener('click', ()=>{ chosenAvatarId = preset.id; refreshGrid(); });\n      return tile;\n    }\n    function refreshGrid(){\n      grid.innerHTML = '';\n      grid.appendChild(buildInitialsTile());\n      AVATAR_PRESETS.forEach(p=> grid.appendChild(buildPresetTile(p)));\n      colorPick.style.display = chosenAvatarId ? 'none' : 'flex';\n    }\n    colorPick.className = 'avatar-pick';\n    AVATAR_COLORS.forEach(c=>{\n      const dot = h('div', {class:'dot'+(c===chosenColor?' selected':''), style:'background:'+c+';', onclick:()=>{\n        colorPick.querySelectorAll('.dot').forEach(d=>d.classList.remove('selected'));\n        dot.classList.add('selected');\n        chosenColor = c;\n        refreshGrid();\n      }});\n      colorPick.appendChild(dot);\n    });\n    refreshGrid();\n    nameInput.addEventListener('input', ()=>{ if(!chosenAvatarId) refreshGrid(); });\n\n    modal.appendChild(h('div', {class:'modal__header'}, h('h3',{},'Meu perfil'), h('button',{class:'icon-btn',onclick:closeModal},icon('x'))));\n    modal.appendChild(h('div', {class:'modal__body'},\n      h('div', {class:'field'}, h('label',{},'Nome exibido'), nameInput),\n      h('div', {class:'section-label'}, 'Avatar'),\n      grid,\n      h('div', {class:'section-label', style:'margin-top:14px;'}, 'Cor das iniciais'),\n      colorPick\n    ));\n    modal.appendChild(h('div', {class:'modal__footer'},\n      h('button', {class:'btn-text', onclick:closeModal}, ' st AI_PROMPT = `Transforme os dados abaixo SOMENTE em linhas neste formato, sem nenhum outro texto e sem markdown:\n\nEXAME: dd/mm/aaaa | nome do exame | resultado | unidade | referência (ex.: 70-99, <200, >40)\nCORRIDA: dd/mm/aaaa | distância em km | tempo (mm:ss ou h:mm:ss) | FC média | observação\nMEDIDA: dd/mm/aaaa | nome da medida | valor | unidade\n\nUse vírgula ou ponto como decimal e não use separador de milhar (ex.: 250000). Uma linha por resultado.\n\nDados: `;\nfunction parseHealth(raw){\n  const out = { medidas: [], exames: [], corridas: [], erros: [] };\n  let mode = null, bia = false, seen = {};\n  const lines = String(raw || \"\").replace(/^﻿/, \"\").split(/\\r?\\n/);\n  lines.forEach((line, i) => {\n    const ln = \"linha \" + (i+1);\n    let l = line.trim().replace(/^[-*•]\\s+/, \"\").replace(/^\\|/, \"\").replace(/\\|$/, \"\").trim();\n    if(!l){ if(mode && mode.type === \"W\") mode = null; return; }\n    if(l[0] === \"#\" || /^[-=|:\\s]{3,}$/.test(l)) return;\n    const km = l.match(/^(EXAMES?|CORRIDAS?|MEDIDAS?|ANTROPOMETRIA)\\s*:\\s*/i);\n    if(km){\n      const kind = stripAcc(km[1]).replace(/s$/, \"\");\n      const c = splitCols(l.slice(km[0].length));\n      const date = parseDateBR(c[0]);\n      if(!date){ out.erros.push(ln + \": data \\\"\" + (c[0]||\"\").slice(0,15) + \"\\\" não reconhecida\"); return; }\n      if(kind === \"exame\"){\n        const val = parseNum(c[2]);\n        if(!c[1] || val === null){ out.erros.push(ln + \": exame precisa de nome e resultado numérico\"); return; }\n        const r = parseRef(c[4]);\n        out.exames.push({ date, nome: c[1], valor: val, unidade: c[3] || \"\", refMin: r.refMin, refMax: r.refMax });\n      } else if(kind === \"corrida\"){\n        const k = parseNum(c[1]), sg = parseDuration(c[2]);\n        if(!k || !sg){ out.erros.push(ln + \": corrida precisa de km e tempo\"); return; }\n        out.corridas.push({ date, km: k, seg: sg, fc: parseNum(c[3]) || null, obs: c.slice(4).join(\" · \") });\n      } else {\n        const val = parseNum(c[2]);\n        if(!c[1] || c[2] === undefined || c[2] === \"\" || c[2] === \"-\"){ out.erros.push(ln + \": medida precisa de nome e valor\"); return; }\n        const meta = canonMetric(c[1] + (c[3] ? \" (\" + c[3] + \")\" : \"\"), /bioimped|\\bbia\\b/i.test(c[1]));\n        out.medidas.push({ date, key: meta.key, info: meta, value: val === null ? c[2] : val });\n      }\n      return;\n    }\n    const c = splitCols(l);\n    // datas de cabeçalho precisam ter ano (senão \"16.9\" vira 16/09)\n    const dateCells = c.slice(1).map(x => /^(\\d{1,2}\\/\\d{1,2}\\/\\d{2,4}|\\d{4}-\\d{1,2}-\\d{1,2})$/.test(x.trim()) ? parseDateBR(x) : null);\n    // cabeçalho de tabela \"transposta\" (medidas nas linhas, datas nas colunas) — como no relatório do nutricionista\n    if(c.length >= 2 && !parseDateBR(c[0]) && dateCells.filter(Boolean).length >= 1 && dateCells.filter(Boolean).length >= (c.length-1)/2){\n      mode = { type: \"T\", dates: dateCells }; bia = false; seen = {}; return;\n    }\n    // cabeçalho de tabela \"larga\" (datas nas linhas)\n    if(c.length >= 2 && /^(data|date|dia)$/.test(stripAcc(c[0]))){\n      const hs = c.slice(1).map(stripAcc);\n      let kind = \"medida\";\n      if(hs.some(x => /^(km|distancia|dist)/.test(x)) && hs.some(x => /tempo|duracao|time/.test(x))) kind = \"corrida\";\n      else if(hs.some(x => /^exame/.test(x))) kind = \"exame\";\n      mode = { type: \"W\", kind, headers: c.slice(1), hs }; return;\n    }\n    if(mode && mode.type === \"T\"){\n      if(c.length === 1){ const t = stripAcc(l); if(/bioimped/.test(t)) bia = true; else if(/antropom|basica|dobra|circunfer/.test(t)) bia = false; return; }\n      const meta0 = canonMetric(c[0], false);\n      const isBia = bia || !!seen[meta0.key];\n      const meta = isBia ? canonMetric(c[0], true) : meta0;\n      seen[meta0.key] = true;\n      mode.dates.forEach((d, j) => {\n        if(!d) return;\n        const cell = (c[j+1] || \"\").trim();\n        if(!cell || cell === \"-\" || cell === \"—\") return;\n        const n = parseNum(cell);\n        out.medidas.push({ date: d, key: meta.key, info: meta, value: n === null ? cell.replace(/\\s*[↑↓].*$/, \"\") : n });\n      });\n      return;\n    }\n    if(mode && mode.type === \"W\"){\n      const date = parseDateBR(c[0]);\n      if(!date){ out.erros.push(ln + \": data \\\"\" + c[0].slice(0,15) + \"\\\" não reconhecida\"); return; }\n      const col = re => mode.hs.findIndex(x => re.test(x)) + 1;\n      if(mode.kind === \"corrida\"){\n        const k = parseNum(c[col(/^(km|distancia|dist)/)]), sg = parseDuration(c[col(/tempo|duracao|time/)]);\n        if(!k || !sg){ out.erros.push(ln + \": falta km ou tempo\"); return; }\n        const fi = col(/^fc|freq/), oi = col(/obs/);\n        out.corridas.push({ date, km: k, seg: sg, fc: fi ? parseNum(c[fi]) : null, obs: oi ? c[oi] || \"\" : \"\" });\n      } else if(mode.kind === \"exame\"){\n        const ni = col(/^exame/), vi = col(/resultado|valor/), ui2 = col(/unidade/), ri = col(/refer/);\n        const val = parseNum(c[vi]);\n        if(!c[ni] || val === null){ out.erros.push(ln + \": falta exame ou resultado\"); return; }\n        const r = parseRef(ri ? c[ri] : \"\");\n        out.exames.push({ date, nome: c[ni], valor: val, unidade: ui2 ? c[ui2] || \"\" : \"\", refMin: r.refMin, refMax: r.refMax });\n      } else {\n        mode.headers.forEach((hd, j) => {\n          const cell = (c[j+1] || \"\").trim();\n          if(!cell || cell === \"-\") return;\n          const meta = canonMetric(hd, /bioimped|\\bbia\\b/i.test(hd));\n          const n = parseNum(cell);\n          out.medidas.push({ date, key: meta.key, info: meta, value: n === null ? cell : n });\n        });\n      }\n      return;\n    }\n    if(parseDateBR(c[0])) out.erros.push(ln + \": faltou o cabeçalho da tabela (ex.: data | peso | cintura) ou o prefixo EXAME:/CORRIDA:/MEDIDA:\");\n  });\n  return out;\n}\n/* relatório de evolução (.html) do sistema do nutricionista -> texto de tabela */\nfunction reportHtmlToText(html){\n  const doc = new DOMParser().parseFromString(html, \"text/html\");\n  const lines = [];\n  doc.querySelectorAll(\".titulo, tr\").forEach(el => {\n    if(el.tagName === \"TR\"){\n      const cells = Array.from(el.querySelectorAll(\"td,th\")).map(td => {\n        const clone = td.cloneNode(true); clone.querySelectorAll(\"span\").forEach(sp => sp.remove());\n        return clone.textContent.replace(/\\s+/g, \" \").trim();\n      });\n      if(cells.length) lines.push(cells.join(\"\\t\"));\n    } else lines.push(el.textContent.replace(/\\s+/g, \" \").trim());\n  });\n  return lines.join(\"\\n\");\n}\nfunction applyHealth(res){\n  let m = 0, e = 0, r = 0, dup = 0;\n  res.medidas.forEach(x => { upsertMeasure(x.date, x.key, x.info, x.value); m++; });\n  res.exames.forEach(x => {\n    if(state.exames.some(y => y.date === x.date && examKey(y.nome) === examKey(x.nome) && y.valor === x.valor)){ dup++; return; }\n    state.exames.push(Object.assign({ id: uid() }, x)); e++;\n  });\n  res.corridas.forEach(x => {\n    if(state.corridas.some(y => y.date === x.date && Math.abs(y.km - x.km) < 0.01 && y.seg === x.seg)){ dup++; return; }\n    state.corridas.push(Object.assign({ id: uid() }, x)); r++;\n  });\n  save();\n  return { m, e, r, dup };\n}\nfunction openImport(){\n  openSheet(sheet => {\n    sheetHead(sheet, \"Carregar em lote\", \"Medidas, exames e corridas de uma vez.\");\n    const b = h(\"div\", {class:\"sheet-b\"});\n    const file = h(\"input\", {type:\"file\", accept:\".html,.htm,text/html\", style:\"display:none\"});\n    const ta = h(\"textarea\", {placeholder:\"Cole aqui…\", style:\"min-height:180px;font-family:var(--num);font-size:12px;\"});\n    file.addEventListener(\"change\", () => {\n      const f = file.files[0]; if(!f) return;\n      const rd = new FileReader();\n      rd.onload = () => { ta.value = reportHtmlToText(rd.result); upd(); if(!res.medidas.length) toast(\"Não achei tabelas de avaliação nesse arquivo.\"); };\n      rd.readAsText(f); file.value = \"\";\n    });\n    b.appendChild(h(\"div\", {class:\"toolbar\"},\n      h(\"button\", {class:\"btn btn-ghost\", onclick: () => file.click()}, \"Importar relatório do nutricionista (.html)\"),\n      h(\"button\", {class:\"btn btn-ghost\", onclick: async () => {\n        try{ await navigator.clipboard.writeText(AI_PROMPT); toast(\"Pedido copiado — cole na IA com seus laudos e traga a resposta.\"); }\n        catch(e){ ta.value = AI_PROMPT; toast(\"Copie o texto do campo e depois apague-o.\"); }\n      }}, \"Copiar pedido para a IA\"), file));\n    b.appendChild(h(\"details\", {style:\"margin-bottom:10px\"},\n      h(\"summary\", {class:\"linkbtn\", style:\"cursor:pointer\"}, \"Formatos aceitos\"),\n      h(\"pre\", {style:\"white-space:pre-wrap;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;color:#cfe0de;margin:8px 0 0;\"},\n        \"# uma linha por resultado\\nEXAME: 10/09/2026 | Glicose em jejum | 92 | mg/dL | 70-99\\nEXAME: 10/09/2026 | LDL | 128 | mg/dL | <130\\nCORRIDA: 12/09/2026 | 5,2 | 28:40 | 158 | parque\\nMEDIDA: 16/09/2026 | Peso | 82,3 | kg\\n\\n# tabela com datas nas linhas (pode colar de planilha)\\ndata | peso | % gordura | cintura\\n16/09/2026 | 82,3 | 20,7 | 77,8\\n\\n# tabela com datas nas colunas (como no relatório)\\nParâmetro | 06/08/2026 | 16/09/2026\\nPeso atual (Kg) | 83,6 | 82,3\\nCircunferência da Cintura (cm) | 79 | 77,8\")));\n    b.appendChild(h(\"div\", {class:\"fld\"}, ta));\n    const prev = h(\"div\", {class:\"note\", style:\"display:none;margin-top:10px\"});\n    b.appendChild(prev);\n    sheet.appendChild(b);\n    const go2 = h(\"button\", {class:\"btn btn-accent\", disabled: true}, \"Carregar\");\n    sheet.appendChild(h(\"div\", {class:\"sheet-f\"}, h(\"div\", {style:\"flex:1\"}), h(\"button\", {class:\"btn btn-ghost\", onclick: () => closeSheet()}, \"Cancelar\"), go2));\n    let res = { medidas: [], exames: [], corridas: [], erros: [] }, t = null;\n    function upd(){\n      res = parseHealth(ta.value);\n      const n = res.medidas.length + res.exames.length + res.corridas.length;\n      go2.disabled = !n;\n      if(!ta.value.trim()){ prev.style.display = \"none\"; return; }\n      prev.style.display = \"\"; prev.innerHTML = \"\";\n      const dates = Array.from(new Set(res.medidas.map(x => x.date))).sort();\n      const parts = [];\n      if(res.medidas.length) parts.push(res.medidas.length + \" valores de medidas em \" + dates.length + \" avaliaç\" + (dates.length === 1 ? \"ão\" : \"ões\") + \" (\" + dates.map(ddmmyy).join(\", \") + \")\");\n      if(res.exames.length) parts.push(res.exames.length + \" resultado\" + (res.exames.length > 1 ? \"s\" : \"\") + \" de exame\");\n      if(res.corridas.length) parts.push(res.corridas.length + \" corrida\" + (res.corridas.length > 1 ? \"s\" : \"\"));\n      prev.appendChild(h(\"div\", {style:\"font-weight:700;color:var(--text)\"}, n ? \"Encontrei: \" + parts.join(\"; \") + \".\" : \"Nenhuma linha válida ainda.\"));\n      if(res.medidas.length){\n        const names = Array.from(new Set(res.medidas.filter(x => typeof x.value === \"number\").map(x => x.info.label)));\n        prev.appendChild(h(\"div\", {style:\"margin-top:4px\"}, names.length + \" medidas: \" + names.slice(0, 8).join(\", \") + (names.length > 8 ? \"…\" : \"\")));\n      }\n      if(res.erros.length){ prev.style.borderLeftColor = \"var(--bad)\"; prev.appendChild(h(\"div\", {style:\"margin-top:6px;color:#fca5a5\"}, res.erros.length + \" linha(s) ignorada(s): \" + res.erros.slice(0,3).join(\"; \") + (res.erros.length > 3 ? \"…\" : \"\"))); }\n      else prev.style.borderLeftColor = \"\";\n    }\n    ta.addEventListener(\"input\", () => { clearTimeout(t); t = setTimeout(upd, 200); });\n    go2.addEventListener(\"click\", () => {\n      upd();\n      const r = applyHealth(res);\n      closeSheet(); render();\n      const p = [];\n      if(r.m) p.push(r.m + \" valores de medidas\");\n      if(r.e) p.push(r.e + \" exames\");\n      if(r.r) p.push(r.r + \" corridas\");\n      toast((p.length ? \"Carregado: \" + p.join(\", \") : \"Nada novo\") + (r.dup ? \" · \" + r.dup + \" já existiam\" : \"\") + \".\");\n    });\n    setTimeout(() => ta.focus(), 50);\n  }, render);\n}\n\n/* ============================================================ sheet */\nlet sheetOnClose = null;\nfunction openSheet(build, onClose){\n  closeSheet(true);\n  sheetOnClose = onClose || null;\n  const root = document.getElementById(\"sheetRoot\");\n  const scrim = h(\"div\", {class:\"scrim\", onclick: e => { if(e.target === scrim) closeSheet(); }});\n  const sheet = h(\"div\", {class:\"sheet\", role:\"dialog\", \"aria-modal\":\"true\"});\n  scrim.appendChild(sheet);\n  build(sheet);\n  root.appendChild(scrim);\n  document.addEventListener(\"keydown\", escClose);\n}\nfunction escClose(e){ if(e.key === \"Escape\") closeSheet(); }\nfunction closeSheet(silent){\n  const root = document.getElementById(\"sheetRoot\");\n  const ae = document.activeElement; if(ae && root.contains(ae) && ae.blur) ae.blur();\n  root.innerHTML = \"\";\n  document.removeEventListener(\"keydown\", escClose);\n  const f = sheetOnClose; sheetOnClose = null;\n  if(f && !silent) f();\n}\nfunction sheetHead(sheet, title, sub){\n  sheet.appendChild(h(\"div\", {class:\"sheet-h\"}, h(\"h2\", {}, title, sub ? h(\"small\", {}, sub) : null), h(\"button\", {class:\"xbtn\", \"aria-label\":\"Fechar\", onclick: () => closeSheet(), html: ICON.x})));\n}\n\n/* ============================================================ criptografia (informação) */\nfunction renderLock(){\n  const el = document.getElementById(\"lockBadge\");\n  const enc = HUB && HUB.encrypted;\n  el.className = \"lock\" + (enc ? \"\" : \" off\");\n  el.innerHTML = ICON.lock + \"<span>\" + (enc ? \"Criptografado\" : \"Sem criptografia\") + \"<\/span>\";\n  el.onclick = () => openSheet(sheet => {\n    sheetHead(sheet, enc ? \"Seus dados de saúde são criptografados\" : \"Criptografia indisponível\", \"\");\n    sheet.appendChild(h(\"div\", {class:\"sheet-b\"},\n      h(\"div\", {style:\"font-size:14px;line-height:1.6;color:#cfe0de\"},\n        enc ? h(\"p\", {}, \"Antes de sair deste aparelho, tudo o que está neste app é cifrado com AES-256-GCM. A chave é derivada da sua conta (identificador único + e-mail) com PBKDF2 e existe só na memória do navegador enquanto o app está aberto — ela nunca é enviada ao Firebase.\")\n            : h(\"p\", {}, \"Este app só tem criptografia quando aberto pelo DecoSoft Hub num endereço seguro (https).\"),\n        enc ? h(\"p\", {}, \"No banco de dados (e na cópia salva no aparelho) aparece só um bloco ilegível. Outra conta não consegue abrir, mesmo que alguém copie o banco.\") : null,\n        enc ? h(\"p\", {class:\"muted small\"}, \"Limite honesto: como a chave vem do seu perfil, quem conseguir entrar na sua conta (com sua senha) vê os dados normalmente — proteja a senha. O “Backup completo” do hub baixa um arquivo legível; guarde-o em lugar seguro.\") : null)));\n    sheet.appendChild(h(\"div\", {class:\"sheet-f\"}, h(\"div\", {style:\"flex:1\"}), h(\"button\", {class:\"btn btn-accent\", onclick: () => closeSheet()}, \"Entendi\")));\n  });\n}\n\n/* ============================================================ init */\ndocument.getElementById(\"brandMark\").innerHTML = ICON.logo;\nif(HUB) document.body.classList.add(\"in-hub\");\nwindow.addEventListener(\"hub:show\", () => { if(!document.querySelector(\"#sheetRoot .scrim\")) render(); });\nrenderLock();\ngo(ui.tab);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}</script>

const $ = id => document.getElementById(id);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  attrs = attrs || {};
  for(const k in attrs){
    const v = attrs[k];
    if(v === null || v === undefined || v === false) continue;
    if(k === "class") e.className = v;
    else if(k === "html") e.innerHTML = v;
    else if(k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for(const c of kids.flat(Infinity)){
    if(c === null || c === undefined || c === false) continue;
    e.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
  }
  return e;
}
function todayIso(){ const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
let toastTimer = null;

  clearTimeout(toastTimer);
  const o = document.querySelector(".htoast"); if(o) o.remove();

  document.body.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), ms || 2600);
}

}
document.querySelectorAll("[data-icon]").forEach(el => el.innerHTML = ICONS[el.dataset.icon]);
function normUser(u){ return String(u || "").trim().toLowerCase(); }
function isEmail(u){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(u); }
function validUser(u){ return isEmail(u) || /^[a-z0-9._-]{3,30}$/.test(u); }
function isOwner(user){ return !!(user && CFG.ownerEmail && user.email && user.email.toLowerCase() === String(CFG.ownerEmail).toLowerCase()); }
function prettyName(user){
  if(!user) return "";
  if(isOwner(user) && CFG.ownerName) return CFG.ownerName;
  const n = String(user.name || "").split(/[._\-+]/)[0] || user.name || "";
  return n.charAt(0).toUpperCase() + n.slice(1);
}

    "auth/unauthorized-domain":"Este endereço não está autorizado no Firebase (Authentication → Settings → Authorized domains).",

  };

}

function makeCloudBackend(fbConfig){
  const F = window.FirebaseKit;
  const app = F.initializeApp(fbConfig);
  const auth = F.initializeAuth(app, { persistence: [F.indexedDBLocalPersistence, F.browserLocalPersistence] });
  const db = F.getFirestore(app);
  if(window.__DECOHUB_EMULATOR__){
    F.connectAuthEmulator(auth, window.__DECOHUB_EMULATOR__.auth, { disableWarnings:true });

  }

  const toEmail = n => isEmail(n) ? n : n+"@"+EMAIL_DOMAIN;
  const toUser = u => u ? { uid: u.uid, email: String(u.email || "").toLowerCase(), name: u.displayName || String(u.email || "").split("@")[0] } : null;
  return {
    kind: "cloud",
    onAuth(cb){ F.onAuthStateChanged(auth, u => cb(toUser(u))); },
    async signIn(name, pass){ const r = await F.signInWithEmailAndPassword(auth, toEmail(name), pass); return toUser(r.user); },
    async resetPassword(name){ await F.sendPasswordResetEmail(auth, toEmail(name)); },
    async signUp(name, pass){
      const r = await F.createUserWithEmailAndPassword(auth, toEmail(name), pass);
      const display = isEmail(name) ? name.split("@")[0] : name;
      try{ await F.updateProfile(r.user, { displayName: display }); }catch(e){}
      return { uid: r.user.uid, name: display, email: toEmail(name).toLowerCase() };
    },
    async signOut(){ await F.signOut(auth); },
    /* lê o app; devolve null se não existir na nuvem */
    async fetch(uid, a, minRev){
      for(let attempt = 0; attempt < 3; attempt++){
        const snap = await F.getDoc(appRef(uid, a));
        if(!snap.exists()) return null;
        const d = snap.data();
        const rev = d.rev || 0;
        if(minRev !== undefined && rev <= minRev) return { rev, data: undefined };
        if(!d.chunks) return { rev, data: d.data == null ? null : d.data };
        const parts = [];
        let ok = true;
        for(let i = 0; i < d.chunks; i++){
          const c = await F.getDoc(chunkRef(uid, a, i));
          if(!c.exists() || (c.data().rev || 0) !== rev){ ok = false; break; }
          parts.push(c.data().data || "");
        }
        if(ok) return { rev, data: parts.join("") };
      }
      throw new Error("leitura inconsistente, tente de novo");
    },
    async push(uid, a, data, baseRev, force){
      const parts = [];
      for(let i = 0; i < data.length; i += CHUNK) parts.push(data.slice(i, i + CHUNK));
      if(!parts.length) parts.push("");
      return F.runTransaction(db, async tx => {
        const snap = await tx.get(appRef(uid, a));
        const remoteRev = snap.exists() ? (snap.data().rev || 0) : 0;
        if(!force && remoteRev !== baseRev) return { conflict: true, remoteRev };
        const rev = remoteRev + 1;
        const meta = { rev, updatedAt: F.serverTimestamp(), device: DEVICE_ID, size: data.length };
        if(parts.length === 1){
          tx.set(appRef(uid, a), Object.assign({ data: parts[0], chunks: 0 }, meta));
        } else {
          parts.forEach((p, i) => tx.set(chunkRef(uid, a, i), { rev, data: p }));
          tx.set(appRef(uid, a), Object.assign({ data: null, chunks: parts.length }, meta));
        }
        return { ok: true, rev };
      });
    }
  };
}

function makeLocalBackend(){
  const UK = "decohub:"+NS+":local-users", SK = "decohub:"+NS+":local-session";
  let cb = null;
  const users = () => { try{ return JSON.parse(localStorage.getItem(UK) || "{}"); }catch(e){ return {}; } };
  async function hash(pass, salt){
    const txt = salt + ":" + pass;
    if(window.crypto && crypto.subtle && window.TextEncoder){
      try{
        const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
        return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,"0")).join("");
      }catch(e){}
    }
    let h1 = 0x811c9dc5; for(let i = 0; i < txt.length; i++){ h1 ^= txt.charCodeAt(i); h1 = Math.imul(h1, 16777619); } return "f"+(h1>>>0).toString(16);
  }
  const userObj = n => ({ uid: "local-"+n, name: isEmail(n) ? n.split("@")[0] : n, email: isEmail(n) ? n : "" });
  return {
    kind: "local",
    onAuth(f){ cb = f; const s = localStorage.getItem(SK); setTimeout(() => f(s && users()[s] ? userObj(s) : null), 0); },
    async signIn(name, pass){
      const u = users()[name];
      if(!u || u.hash !== await hash(pass, u.salt)) throw { code: "auth/invalid-credential" };
      localStorage.setItem(SK, name); return userObj(name);
    },
    async signUp(name, pass){
      const all = users();
      if(all[name]) throw { code: "auth/email-already-in-use" };
      if(pass.length < 6) throw { code: "auth/weak-password" };
      const salt = Math.random().toString(36).slice(2);
      all[name] = { salt, hash: await hash(pass, salt) };
      localStorage.setItem(UK, JSON.stringify(all));
      localStorage.setItem(SK, name); return userObj(name);
    },
    async signOut(){ localStorage.removeItem(SK); },
    async fetch(){ return null; },
    async push(uid, a, data, baseRev){ return { ok: true, rev: baseRev + 1 }; }
  };
}

/* =====================================================================
   COFRE — criptografia dos apps sensíveis (Saúde)
   AES-256-GCM; chave derivada (PBKDF2) do uid + e-mail da conta.
   A chave só existe na memória do navegador; Firebase e cache local
   guardam apenas o texto cifrado ("enc1:...").
===================================================================== */
const ENCRYPTED = { saude: true };
function b64(u8){ let s = ""; for(let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function unb64(t){ const s = atob(t), u = new Uint8Array(s.length); for(let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
const Vault = {
  key: null, uid: null,
  available(){ return !!(window.crypto && crypto.subtle && window.TextEncoder); },
  async unlock(user){
    if(!this.available()) throw new Error("Este navegador não oferece criptografia (abra pelo endereço https).");
    if(this.key && this.uid === user.uid) return;
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey("raw", enc.encode("decosoft-hub/saude/v1|" + user.uid + "|" + String(user.email || "").toLowerCase()), "PBKDF2", false, ["deriveKey"]);
    const salt = new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode("decosoft-hub/salt/v1|" + user.uid)));
    this.key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 250000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    this.uid = user.uid;
  },
  lock(){ this.key = null; this.uid = null; },
  async encrypt(plain){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, this.key, new TextEncoder().encode(plain == null ? "" : plain)));
    return "enc1:" + b64(iv) + ":" + b64(ct);
  },
  async decrypt(str){
    if(str == null) return null;
    if(str.indexOf("enc1:") !== 0) return str;
    const p = str.split(":");
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(p[1]) }, this.key, unb64(p[2]));
    return new TextDecoder().decode(pt);
  }
};

/* =====================================================================
   SYNC — cache no aparelho + nuvem com controle de versão (rev)
===================================================================== */
const Sync = {
  blocked: {},      // app -> motivo (dados cifrados que não abriram)
  pseq: {},
  uid: null,
  mem: {},          // app -> { data, rev, dirty }
  timers: {},
  pushing: {},
  again: {},
  status: "synced",
  lastError: "",
  readyPromise: null,
  quotaWarned: false,

  key(a){ return "decohub:"+NS+":"+this.uid+":"+a; },
  start(user){
    const uid = user.uid;
    this.uid = uid;
    this.mem = {};
    this.blocked = {};
    const cached = {};
    APPS.forEach(a => {
      let e = null;
      try{ e = JSON.parse(localStorage.getItem(this.key(a.id)) || "null"); }catch(err){}
      if(!e || typeof e !== "object") e = null;
      if(ENCRYPTED[a.id]){
        this.mem[a.id] = { data: null, rev: e ? e.rev || 0 : 0, dirty: e ? !!e.dirty : false };
        if(e && e.cipher) cached[a.id] = e.cipher;
      } else this.mem[a.id] = e ? { data: e.data == null ? null : e.data, rev: e.rev || 0, dirty: !!e.dirty } : { data: null, rev: 0, dirty: false };
    });
    this.setStatus(CLOUD ? "synced" : "local");
    const unlock = (async () => {
      try{ await Vault.unlock(user); }
      catch(err){ Object.keys(ENCRYPTED).forEach(a => this.blocked[a] = String(err.message || err)); return; }
      for(const a of Object.keys(cached)){
        try{ if(uid === this.uid) this.mem[a].data = await Vault.decrypt(cached[a]); }
        catch(err){ this.mem[a].rev = 0; this.mem[a].dirty = false; console.warn("cache cifrado ilegível", a, err); }
      }
    })();
    this.readyPromise = unlock.then(() => {
      if(!CLOUD){ Integr.schedule(300); return; }
      return Promise.race([ this.pullAll(), new Promise(r => setTimeout(r, 9000)) ]);
    });
  },
  stop(){
    Object.values(this.timers).forEach(clearTimeout);
    this.timers = {}; this.pushing = {}; this.again = {};
    this.uid = null; this.mem = {}; this.blocked = {};
    Vault.lock();
  },
  persist(a){
    const e = this.mem[a];
    if(ENCRYPTED[a]){
      if(!Vault.key || this.blocked[a]) return;
      const seq = this.pseq[a] = (this.pseq[a] || 0) + 1, k = this.key(a), uid = this.uid;
      Vault.encrypt(e.data).then(cipher => {
        if(seq !== this.pseq[a] || uid !== this.uid) return;
        try{ localStorage.setItem(k, JSON.stringify({ cipher, rev: e.rev, dirty: e.dirty })); }catch(err){}
      });
      return;
    }
    try{ localStorage.setItem(this.key(a), JSON.stringify(e)); }
    catch(err){
      if(!this.quotaWarned){ this.quotaWarned = true; toast(CLOUD ? "Memória do navegador cheia — os dados seguem salvos na nuvem." : "Memória do navegador cheia — exporte um backup e apague imagens grandes.", 5000); }
    }
  },
  get(a){ return this.mem[a] ? this.mem[a].data : null; },
  set(a, value){
    const e = this.mem[a];
    if(!e || !this.uid || this.blocked[a]) return;
    if(e.data === value) return;
    e.data = value;
    e.dirty = true;
    this.persist(a);
    this.schedule(a);
  },
  schedule(a, ms){
    clearTimeout(this.timers[a]);
    if(CLOUD) this.setStatus("saving");
    this.timers[a] = setTimeout(() => this.push(a), ms === undefined ? 900 : ms);
  },
  anyDirty(){ return Object.keys(this.mem).some(a => this.mem[a].dirty); },
  refreshStatus(){
    if(!CLOUD) return this.setStatus("local");
    if(this.status === "error") return;
    if(!navigator.onLine) return this.setStatus(this.anyDirty() ? "offline" : "offline");
    if(Object.keys(this.pushing).some(a => this.pushing[a]) || this.anyDirty()) return this.setStatus("saving");
    this.setStatus("synced");
  },
  setStatus(s, err){
    this.status = s;
    if(err !== undefined) this.lastError = err;
    const txt = { synced:"Sincronizado", saving:"Salvando…", offline:"Offline · salvo no aparelho", error:"Erro ao sincronizar", local:"Só neste aparelho" }[s];
    ["syncHome","syncApp"].forEach(id => { const el = $(id); el.dataset.s = s; el.querySelector("span").textContent = txt; el.title = s === "error" ? this.lastError : s === "local" ? "Modo local: configure o Firebase para sincronizar entre aparelhos." : txt; });
  },
  async push(a, force){
    const e = this.mem[a];
    if(!e || !this.uid) return;
    if(!CLOUD){ if(e.dirty){ e.rev += 1; e.dirty = false; this.persist(a); } return; }
    if(!e.dirty && !force) return this.refreshStatus();
    if(!navigator.onLine){ this.setStatus("offline"); return; }
    if(this.pushing[a]){ this.again[a] = true; return; }
    if(this.blocked[a]) return;
    this.pushing[a] = true;
    const uid = this.uid;
    const sending = e.data == null ? "" : e.data;
    try{
      const wire = ENCRYPTED[a] ? await Vault.encrypt(sending) : sending;
      const res = await backend.push(uid, a, wire, e.rev, !!force);
      if(uid !== this.uid) return;
      if(res.conflict){ this.pushing[a] = false; this.status = "saving"; return Conflict.ask(a, res.remoteRev); }
      e.rev = res.rev;
      if(e.data === sending || (e.data == null && sending === "")) e.dirty = false;
      this.persist(a);
      this.status = "synced";
    }catch(err){
      console.warn("push", a, err);
      const netErr = /unavailable|network|offline|fetch|deadline/i.test(String((err && (err.code || err.message)) || ""));
      this.setStatus(netErr ? "offline" : "error", friendlyError(err));
      clearTimeout(this.timers[a]);
      this.timers[a] = setTimeout(() => { if(this.status === "error" || this.status === "offline") this.status = "saving"; this.push(a); }, 15000);
      this.pushing[a] = false;
      return;
    }
    this.pushing[a] = false;
    if(this.again[a] || e.dirty){ this.again[a] = false; this.schedule(a, 300); }
    this.refreshStatus();
  },
  async pull(a){
    if(!CLOUD || !this.uid) return;
    const e = this.mem[a];
    const uid = this.uid;
    const r = await backend.fetch(uid, a, e.rev);
    if(uid !== this.uid) return;
    if(!r){ if(e.dirty || e.data != null) this.schedule(a, 50); return; }   // nuvem vazia: envia o que houver aqui
    if(r.rev <= e.rev){ if(e.dirty) this.schedule(a, 50); return; }
    if(e.dirty){ this.schedule(a, 50); return; }                           // vai dar conflito → pergunta
    const full = r.data === undefined ? await backend.fetch(uid, a) : r;
    if(!full || uid !== this.uid) return;
    let data = full.data;
    if(ENCRYPTED[a] && data){
      try{ data = await Vault.decrypt(data); }
      catch(err){ this.blocked[a] = "Os dados de saúde na nuvem não abriram com a chave desta conta."; this.setStatus("error", this.blocked[a]); return; }
    }
    if(uid !== this.uid) return;
    e.data = data; e.rev = full.rev; e.dirty = false;
    this.persist(a);
    Frames.remoteChanged(a);
  },
  async pullAll(){
    if(!CLOUD || !this.uid) return;
    if(!navigator.onLine){ this.setStatus("offline"); return; }
    try{
      await Promise.all(APPS.map(a => this.pull(a.id)));
      if(this.status === "error") this.status = "synced";
      this.refreshStatus();
      Home.renderSummaries();
      Integr.schedule(300);
    }catch(err){
      console.error("pull", err);
      this.setStatus("error", friendlyError(err));
    }
  },
  async flush(){
    const list = APPS.map(a => a.id).filter(a => this.mem[a] && this.mem[a].dirty);
    for(const a of list){ clearTimeout(this.timers[a]); await this.push(a); }
    return !this.anyDirty();
  }
};

/* ponte usada pelos apps (cada app roda num iframe e chama window.parent.DecoHub) */
window.DecoHub = {
  getItem(app){ return Sync.get(app); },
  setItem(app, value){ Sync.set(app, value == null ? null : String(value)); Home.dirtySummaries = true; if(app === "treinos" || app === "estudos") Integr.schedule(); },
  userName(){ return prettyName(Session.user); },
  isBlank(){ return !isOwner(Session.user); },
  isEncrypted(app){ return !!ENCRYPTED[app] && !!Vault.key && !Sync.blocked[app]; },
  /* um app lendo/escrevendo dados de outro (só pares autorizados) */
  peerGet(from, to){ return (PEERS[from] || []).indexOf(to) !== -1 ? Sync.get(to) : null; },
  peerUpdate(from, to, fn){
    if((PEERS[from] || []).indexOf(to) === -1) return false;
    const cur = Sync.get(to);
    const next = fn(cur);
    if(typeof next === "string" && next !== cur){ Sync.set(to, next); Frames.invalidate(to); Home.dirtySummaries = true; }
    return true;
  }
};
const PEERS = { saude: ["untony", "treinos", "estudos"] };

/* =====================================================================
   PONTE TREINOS/ESTUDOS → DRELLO UNTONY
   Quando a chave estiver ligada no app de Treinos ou de Estudos, o hub
   coloca as atividades na semana atual e na próxima do UNTONY e marca
   como feitas quando forem concluídas. Tarefas automáticas levam
   src/ak para serem reconhecidas; nunca desmarca o que você marcou.
===================================================================== */
const Integr = {
  timer: null,
  schedule(ms){ clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), ms === undefined ? 700 : ms); },
  iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); },
  add(x, n){ const [y,m,d] = x.split("-").map(Number); const t = new Date(y, m-1, d); t.setDate(t.getDate()+n); return this.iso(t); },
  revSat(date){
    const r = this.add(date, 21), [y,m,d] = r.split("-").map(Number), w = new Date(y, m-1, d).getDay();
    const fwd = (6 - w + 7) % 7, back = (w + 1) % 7;
    return this.add(r, fwd <= back ? fwd : -back);
  },
  run(){
    if(!Session.user || !Sync.uid) return;
    const parse = a => { try{ const r = Sync.get(a); return r ? JSON.parse(r) : null; }catch(e){ return null; } };
    const tr = parse("treinos"), es = parse("estudos");
    const now = new Date(), today = this.iso(now);
    const mon = this.add(today, -((now.getDay() + 6) % 7));
    const days = []; for(let i = 0; i < 14; i++) days.push(this.add(mon, i));
    const want = [];
    if(tr && tr.untony && tr.untony.on){
      const dias = Array.isArray(tr.untony.dias) ? tr.untony.dias : [0,1,2,3,4];
      days.forEach((d, i) => {
        const done = !!(tr.history && tr.history[d]);
        if(dias.indexOf(i % 7) !== -1 || done) want.push({ date: d, ak: "treinos:"+d, src: "treinos", text: "🏋️ Treino", done });
      });
    }
    if(es && es.untony && es.untony.on && Array.isArray(es.temas)){
      const first = days[0], last = days[days.length-1];
      const sats = {};
      es.temas.forEach(t => {
        if(t.date >= first && t.date <= last) want.push({ date: t.date, ak: "estudos:"+t.id, src: "estudos", text: "📚 " + t.tema, done: !!t.feito });
        if(t.feito){ const s = this.revSat(t.date); if(s >= first && s <= last) (sats[s] = sats[s] || []).push(t); }
      });
      Object.keys(sats).forEach(s => {
        const list = sats[s], n = list.length;
        want.push({ date: s, ak: "estudos:rev:"+s, src: "estudos", text: "🔁 Revisão: " + n + " tema" + (n > 1 ? "s" : ""), done: list.every(t => t.revFeita) });
      });
    }
    let st = parse("untony");
    const hadData = !!st;
    if(!st){
      if(!want.length) return;
      st = { templates: [{ id: "t1", text: "Academia" }, { id: "t2", text: "Skincare" }], tasksByDate: {} };
    }
    if(!st.tasksByDate || typeof st.tasksByDate !== "object") st.tasksByDate = {};
    const wantBy = {}; want.forEach(w => wantBy[w.ak] = w);
    const existing = {};
    let changed = false;
    days.forEach(d => {
      const arr = st.tasksByDate[d]; if(!Array.isArray(arr)) return;
      for(let i = arr.length - 1; i >= 0; i--){
        const t = arr[i];
        if(!t || !t.src || (t.src !== "treinos" && t.src !== "estudos")) continue;
        if(!wantBy[t.ak] && !t.done){ arr.splice(i, 1); changed = true; continue; }   // desligado ou não existe mais
        if(wantBy[t.ak]) existing[t.ak] = { d, t, arr };
      }
    });
    want.forEach(w => {
      const ex = existing[w.ak];
      if(ex){
        if(ex.d !== w.date){ ex.arr.splice(ex.arr.indexOf(ex.t), 1); (st.tasksByDate[w.date] = st.tasksByDate[w.date] || []).push(ex.t); changed = true; }
        if(ex.t.text !== w.text){ ex.t.text = w.text; changed = true; }
        if(w.done && !ex.t.done){ ex.t.done = true; changed = true; }
      } else {
        (st.tasksByDate[w.date] = st.tasksByDate[w.date] || []).push({ id: "a" + Math.random().toString(36).slice(2, 10), text: w.text, done: w.done, src: w.src, ak: w.ak });
        changed = true;
      }
    });
    Object.keys(st.tasksByDate).forEach(d => { if(Array.isArray(st.tasksByDate[d]) && !st.tasksByDate[d].length) delete st.tasksByDate[d]; });
    if(!changed) return;
    if(!hadData && !want.length) return;
    Sync.set("untony", JSON.stringify(st));
    Frames.invalidate("untony");
    Home.dirtySummaries = true;
  }
};

/* outra aba aberta neste mesmo aparelho mudou algo */
window.addEventListener("storage", ev => {
  if(!Sync.uid || !ev.key || ev.key.indexOf("decohub:"+NS+":"+Sync.uid+":") !== 0) return;
  const a = ev.key.split(":").pop();
  if(!Sync.mem[a]) return;
  try{
    const e = JSON.parse(ev.newValue || "null");
    if(!e) return;
    if(ENCRYPTED[a]){
      if(!e.cipher || !Vault.key) return;
      Vault.decrypt(e.cipher).then(data => { if(data === Sync.mem[a].data) return; Sync.mem[a] = { data, rev: e.rev || 0, dirty: !!e.dirty }; Frames.remoteChanged(a); }).catch(() => {});
      return;
    }
    if(e.data === Sync.mem[a].data) return;
    Sync.mem[a] = { data: e.data, rev: e.rev || 0, dirty: !!e.dirty };
    Frames.remoteChanged(a);
  }catch(err){}
});
window.addEventListener("online", () => { if(Sync.uid){ Sync.refreshStatus(); Sync.pullAll().then(() => Sync.flush()); } });
window.addEventListener("offline", () => { if(Sync.uid && CLOUD) Sync.setStatus("offline"); });

  else { Sync.pullAll(); Frames.reloadStaleIfSafe(); }
});

/* =====================================================================
   CONFLITO — mesmo app mudou em dois aparelhos ao mesmo tempo
===================================================================== */
const Conflict = {
  open: {},
  ask(a, remoteRev){
    if(this.open[a]) return;
    this.open[a] = true;
    const app = APP_BY_ID[a];
    Modal.show(box => {
      box.appendChild(h("h2", {}, "Duas versões de "+app.name));
      box.appendChild(h("p", {}, "Esse app foi alterado em outro aparelho enquanto você mexia nele aqui. Qual versão fica valendo? A outra é descartada."));

/* =====================================================================
   ÍCONES / MANIFESTO por app (para os atalhos na tela inicial)
===================================================================== */
const iconCache = {};
function appIconSvg(app, size){
  const bg = app ? (app.grad ? null : app.color) : null;
  const inner = (app ? ICONS[app.id] : ICONS.hub).replace("<svg ", '<svg x="22" y="22" width="56" height="56" color="'+(app ? app.ink : "#0A0C12")+'" ');
  const fill = app && !app.grad ? '<rect width="100" height="100" rx="22" fill="'+bg+'"/>'
             : '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs><rect width="100" height="100" rx="22" fill="url(#g)"/>';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="'+size+'" height="'+size+'">'+fill+inner+'</svg>';
}
function svgDataUrl(svg){ return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); }
function pngIcon(app, size){
  const k = (app ? app.id : "hub")+":"+size;
  if(iconCache[k]) return Promise.resolve(iconCache[k]);
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      try{
        const c = document.createElement("canvas"); c.width = c.height = size;
        c.getContext("2d").drawImage(img, 0, 0, size, size);
        iconCache[k] = c.toDataURL("image/png"); res(iconCache[k]);
      }catch(e){ res(svgDataUrl(appIconSvg(app, size))); }
    };
    img.onerror = () => res(svgDataUrl(appIconSvg(app, size)));
    img.src = svgDataUrl(appIconSvg(app, size));
  });
}
let brandToken = 0;
async function applyBranding(app){
  const token = ++brandToken;
  const name = app ? app.name : "DecoSoft Hub";
  document.title = name;
  $("metaAppleTitle").setAttribute("content", app ? app.short : "DecoSoft Hub");
  document.querySelector('meta[name="theme-color"]').setAttribute("content", app ? app.bg : "#0A0C12");
  $("favicon").href = svgDataUrl(appIconSvg(app, 64));
  const [p180, p192, p512] = await Promise.all([pngIcon(app, 180), pngIcon(app, 192), pngIcon(app, 512)]);
  if(token !== brandToken) return;
  $("touchIcon").href = p180;
  const base = location.href.split("#")[0];
  const manifest = {
    name, short_name: app ? app.short : "Hub",
    start_url: base + (app ? "#/"+app.id : "#/"),
    scope: base.replace(/[^/]*$/, ""),
    display: "standalone",
    background_color: app ? app.bg : "#0A0C12",
    theme_color: app ? app.bg : "#0A0C12",
    icons: [ { src: p192, sizes: "192x192", type: "image/png" }, { src: p512, sizes: "512x512", type: "image/png", purpose: "any" } ]
  };
  $("manifestLink").href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest));
}

/* =====================================================================
   FRAMES — cada app num iframe isolado (sem conflito de estilos)
===================================================================== */
const Frames = {
  el: {},
  stale: {},
  ensure(a){
    if(this.el[a] && !this.stale[a]) return this.el[a];
    if(this.el[a]) this.el[a].remove();
    const f = document.createElement("iframe");
    f.title = APP_BY_ID[a].name;
    f.setAttribute("allow", "geolocation; clipboard-write; fullscreen");
    f.srcdoc = Sync.blocked[a]
      ? "<div style='color:#eee;font-family:sans-serif;padding:28px;max-width:520px;line-height:1.6'><h2 style='margin-top:0'>Não foi possível abrir os dados protegidos</h2><p>" + String(Sync.blocked[a]).replace(/</g,"&lt;") + "</p><p style='color:#999'>Nada foi apagado. Confira se entrou com a mesma conta (mesmo e-mail) em que os dados foram criados, e se o endereço começa com https.</p></div>"
      : (APP_SRC[a] || "<p style='color:#fff;font-family:sans-serif;padding:20px'>App não encontrado.</p>");
    $("frames").appendChild(f);
    this.el[a] = f;
    this.stale[a] = false;
    return f;
  },
  show(a){
    Object.keys(this.el).forEach(k => this.el[k].classList.toggle("on", k === a));
    const f = this.ensure(a);
    f.classList.add("on");
    $("banner").classList.remove("on");
    try{ if(f.contentWindow && f.contentDocument && f.contentDocument.readyState !== "loading") f.contentWindow.dispatchEvent(new Event("hub:show")); }catch(e){}
    setTimeout(() => { try{ f.contentWindow.focus(); }catch(e){} }, 50);
  },
  hideAll(){ Object.values(this.el).forEach(f => f.classList.remove("on")); $("banner").classList.remove("on"); },
  reload(a){
    if(!this.el[a]) return;
    const wasOn = this.el[a].classList.contains("on");
    this.stale[a] = true;
    if(wasOn) this.show(a); else { this.el[a].remove(); delete this.el[a]; }
  },
  isBusy(a){
    try{
      const d = this.el[a].contentDocument;
      const ae = d.activeElement;
      if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return true;
      if(d.querySelector(".modal-overlay, .scrim, .sheet")) return true;
      return false;
    }catch(e){ return false; }
  },
  remoteChanged(a){
    Home.dirtySummaries = true;
    if(!this.el[a]) return;
    if(Router.current !== a){ this.el[a].remove(); delete this.el[a]; delete this.stale[a]; return; }
    if(document.hidden){ this.stale[a] = true; return; }
    if(this.isBusy(a)){ this.stale[a] = true; $("banner").classList.add("on"); }
    else { this.reload(a); toast("Atualizado com o que você fez em outro aparelho."); }
  },
  reloadStaleIfSafe(){
    const a = Router.current;
    if(!a || !this.stale[a] || !this.el[a]) return;
    if(this.isBusy(a)) $("banner").classList.add("on");
    else { this.reload(a); toast("Atualizado com o que você fez em outro aparelho."); }
  },
  invalidate(a){
    if(!this.el[a]) return;
    if(Router.current === a){ this.stale[a] = true; return; }
    this.el[a].remove(); delete this.el[a]; delete this.stale[a];
  },
  destroyAll(){ Object.values(this.el).forEach(f => f.remove()); this.el = {}; this.stale = {}; }
};
$("bannerBtn").addEventListener("click", () => { const a = Router.current; if(a) Frames.reload(a); });

        h("div", {class:"tile-sum", id:"sum-"+app.id}, "…")
      );

    });

  },
  displayName(n){ return n ? n.charAt(0).toUpperCase() + n.slice(1) : ""; },
  renderSummaries(){
    if(!Session.user) return;
    APPS.forEach(app => {
      const el = $("sum-"+app.id);
      if(!el) return;
      let html;
      try{ html = this.summary(app.id, Sync.get(app.id)); }catch(e){ html = null; }
      el.innerHTML = html || "Abrir";
    });
    this.dirtySummaries = false;
  },
  summary(id, raw){
    const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    const today = todayIso();
    const d = raw ? JSON.parse(raw) : null;
    if(id === "estudos"){
      if(!d) return isOwner(Session.user) ? "Hoje e próximos temas, atrasos, revisões e provas." : "Cole seu cronograma de estudos para começar.";
      if(!(d.temas || []).length) return "Plano vazio — toque para colar seu cronograma.";
      const t = (d.temas || []).find(x => x.date === today);
      const late = (d.temas || []).filter(x => x.date < today && !x.feito).length;
      const done = (d.temas || []).filter(x => x.feito).length;
      let s = t ? (t.feito ? "Tema de hoje feito ✓ " : "Hoje: <b>"+esc(t.tema)+"</b>") : "Sem tema novo hoje";
      s += "<br><span style='color:var(--muted)'>"+done+"/"+(d.temas||[]).length+" temas"+(late ? " · "+late+" atrasado"+(late>1?"s":"") : "")+"</span>";
      return s;
    }
    if(id === "treinos"){
      if(!d) return isOwner(Session.user) ? "Treino 16 pronto · marque os exercícios do dia." : "Cole seus treinos para começar.";
      if(!(d.workouts || []).length) return "Nenhum treino ainda — toque para colar o seu.";
      const n = (d.workouts || []).length;
      const done = d.history && d.history[today];
      return (done ? "<b>Treinou hoje ✓</b>" : "Ainda não treinou hoje") + "<br><span style='color:var(--muted)'>"+n+" treino"+(n!==1?"s":"")+" salvo"+(n!==1?"s":"")+"</span>";
    }
    if(id === "untony"){
      if(!d) return "Hábitos da semana, metas e clima.";
      const list = (d.tasksByDate && d.tasksByDate[today]) || [];
      if(!list.length) return "Nada marcado para hoje.";
      const done = list.filter(x => x.done).length;
      return "Hoje: <b>"+done+"/"+list.length+"</b> concluídas" + (list.length && done/list.length*100 >= (d.goalPct||80) ? " · meta batida ★" : "");
    }
    if(id === "saude"){
      if(Sync.blocked.saude) return "<span style='color:var(--bad)'>Dados protegidos não abriram — toque para ver.</span>";
      if(!d) return "Medidas com gráficos, exames e corridas. Criptografado.";
      const ms = (d.medidas || []).filter(m => m.values && typeof m.values.peso === "number").sort((a,b) => a.date < b.date ? -1 : 1);
      const runs = (d.corridas || []).slice().sort((a,b) => a.date < b.date ? -1 : 1);
      const parts = [];
      if(ms.length){ const l = ms[ms.length-1], p = ms[ms.length-2]; parts.push("Peso <b>"+String(l.values.peso).replace(".", ",")+" kg</b>"+(p ? " ("+(l.values.peso - p.values.peso > 0 ? "+" : "")+(l.values.peso - p.values.peso).toFixed(1).replace(".", ",")+")" : "")); }
      if(runs.length){ const r = runs[runs.length-1]; parts.push("última corrida "+String(Math.round(r.km*10)/10).replace(".", ",")+" km"); }
      return parts.length ? parts.join(" · ") + "<br><span style='color:var(--muted)'>🔒 criptografado</span>" : "Nada registrado ainda. 🔒 criptografado";
    }
    if(id === "drello"){
      if(!d) return "Seus quadros, listas e cartões.";
      let open = 0, overdue = 0;
      (d.boards || []).forEach(b => (b.lists || []).forEach(l => (l.cards || []).forEach(c => { if(!c.done){ open++; if(c.due && c.due < today) overdue++; } })));
      return "<b>"+open+"</b> "+(open===1?"cartão":"cartões")+" em aberto" + (overdue ? " · <span style='color:var(--bad)'>"+overdue+" atrasado"+(overdue>1?"s":"")+"</span>" : "") + "<br><span style='color:var(--muted)'>"+(d.boards||[]).length+" quadro"+((d.boards||[]).length!==1?"s":"")+"</span>";
    }
    return null;
  }
};

===================================================================== */
const Router = {
  current: null,
  ready: false,
  parse(){ const r = location.hash.replace(/^#\/?/, "").split(/[/?]/)[0].toLowerCase(); return APP_BY_ID[r] ? r : null; },
  async route(){
    if(!this.ready) return;
    if(!Modal.locked) Modal.close();
    const target = this.parse();
    if(!Session.user){
      this.current = null;
      Frames.hideAll();
      applyBranding(target ? APP_BY_ID[target] : null);
      $("lSub").dataset.target = target || "";
      showScreen("login");
      setTimeout(() => { try{ $("lUser").focus({preventScroll:true}); }catch(e){} }, 60);
      return;
    }
    if(!target){
      this.current = null;
      Frames.hideAll();
      applyBranding(null);
      Home.render();
      showScreen("home");
      return;
    }
    this.current = target;
    const app = APP_BY_ID[target];
    applyBranding(app);
    document.documentElement.style.setProperty("--abg", app.bg);
    $("appview").style.setProperty("--abg", app.bg);
    $("abarIc").style.background = app.grad || app.color;
    $("abarIc").style.color = app.ink;
    $("abarIc").innerHTML = ICONS[app.id];
    $("abarName").textContent = app.name;
    showScreen("appview");
    Frames.hideAll();
    const wait = $("frameWait");
    const ready = Sync.readyPromise || Promise.resolve();
    let settled = false;
    ready.then(() => { settled = true; });
    await Promise.resolve();
    if(!settled){ wait.classList.add("on"); await ready; }
    wait.classList.remove("on");
    if(this.current === target) Frames.show(target);
  }
};

      h("button", {class:"btn btn-ghost", onclick: () => file.click()}, "Importar…"),
      h("button", {class:"btn btn-main", style:"margin-top:0", onclick: () => {
        const apps = {};
        APPS.forEach(a => { const raw = Sync.get(a.id); try{ apps[a.id] = raw ? JSON.parse(raw) : null; }catch(e){ apps[a.id] = raw; } });
        const blob = new Blob([JSON.stringify({ kind:"decosoft-hub-backup", v:1, user: Session.user.name, date: new Date().toISOString(), apps }, null, 1)], { type:"application/json" });
        const url = URL.createObjectURL(blob);
        const link = h("a", {href:url, download:"decosoft-hub-backup-"+todayIso()+".json"});
        document.body.appendChild(link); link.click(); link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        toast("Backup baixado.");
      }}, "Exportar")
    ));
  });
}
function openLinkModal(){
  const app = APP_BY_ID[Router.current];
  const url = location.href.split("#")[0] + "#/" + app.id;
  Modal.show(box => {
    box.appendChild(h("h2", {}, "Atalho para "+app.name));
    box.appendChild(h("p", {}, "Este endereço abre o "+app.name+" direto (depois do login, que fica salvo)."));
    const inp = h("input", {readonly:true, value:url}); inp.value = url;
    const copy = h("button", {class:"btn btn-ghost", onclick: async () => {
      try{ await navigator.clipboard.writeText(url); toast("Link copiado."); }
      catch(e){ inp.select(); try{ document.execCommand("copy"); toast("Link copiado."); }catch(x){ toast("Selecione e copie o link."); } }
    }}, "Copiar");
    box.appendChild(h("div", {class:"urlbox"}, inp, copy));
    box.appendChild(h("div", {class:"howto"}, h("b", {}, "iPhone (Safari): "), "toque em Compartilhar ", h("b", {}, "⬆︎"), " → ", h("b", {}, "Adicionar à Tela de Início"), "."));
    box.appendChild(h("div", {class:"howto"}, h("b", {}, "Android (Chrome): "), "menu ", h("b", {}, "⋮"), " → ", h("b", {}, "Adicionar à tela inicial"), "."));
    box.appendChild(h("div", {class:"howto"}, h("b", {}, "Computador: "), h("b", {}, "Ctrl+D"), " para favoritar, ou no Chrome: menu ⋮ → Transmitir, salvar e compartilhar → ", h("b", {}, "Criar atalho"), "."));
    box.appendChild(h("div", {class:"acts"}, h("button", {class:"btn btn-ghost", onclick: () => Modal.close()}, "Fechar")));
  });
}
$("userBtn").addEventListener("click", openUserMenu);
$("footBackup").addEventListener("click", openBackup);
$("footLogout").addEventListener("click", () => Session.logout());
$("btnHome").addEventListener("click", () => { location.hash = "#/"; });
$("btnLink").addEventListener("click", openLinkModal);
["syncHome","syncApp"].forEach(id => $(id).addEventListener("click", () => { if(Sync.status === "error") toast(Sync.lastError || "Erro ao sincronizar.", 6000); }));
setInterval(() => { if(Router.current === null && Session.user && Home.dirtySummaries && $("home").classList.contains("on")) Home.renderSummaries(); }, 1500);

/* =====================================================================
   INÍCIO
===================================================================== */
setupLogin();
let firstAuth = true;
backend.onAuth(user => {
  if(firstAuth){ firstAuth = false; Router.ready = true; if(!user){ Session.user = null; Router.route(); return; } }
  if(user && Session.user && user.uid === Session.user.uid){
    if(user.name && user.name !== Session.user.name && !/^[a-z0-9]{20,}$/i.test(user.name)) Session.user.name = user.name;
    if(user.email && !Session.user.email) Session.user.email = user.email;
    return;
  }
  Session.set(user);
});
setTimeout(() => { if(firstAuth){ firstAuth = false; Router.ready = true; Router.route(); } }, 8000);

})();
</script>
</body>
